<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAIBATSU ─ 鬼教師 2G JONES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:#020308;color:#cfc8b4;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","MS Mincho",serif;overflow:hidden}
:root{--cw:76px;--ch:100px}
button{font-family:inherit;cursor:pointer}
svg{display:block}
#app{position:fixed;inset:0;max-width:640px;margin:0 auto;display:flex;flex-direction:column;background:#05070d;box-shadow:0 0 80px #000 inset;overflow:hidden}

/* ===== topbar ===== */
#topbar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:linear-gradient(#0d1220,#080b14);border-bottom:1px solid #1c2438;font-size:13px;min-height:36px;z-index:30;flex:none}
#tb-igen{color:#e8c76a;text-shadow:0 0 8px rgba(232,199,106,.5);white-space:nowrap}
#tb-candles{letter-spacing:2px;white-space:nowrap}
#tb-items{font-size:13px;white-space:nowrap}
#tb-area{flex:1;text-align:center;color:#7f8aa5;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#tb-deckbtn{background:#141a2c;border:1px solid #2a3450;color:#cfc8b4;font-size:11px;padding:3px 10px;border-radius:4px}
.candle-lit{color:#f0b040;text-shadow:0 0 8px rgba(240,170,40,.8);animation:flick 2s infinite;display:inline-block}
.candle-out{opacity:.25;filter:grayscale(1)}

#screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}
@keyframes flick{0%,100%{opacity:1;transform:scale(1)}45%{opacity:.78;transform:scale(.97) rotate(-2deg)}70%{opacity:.92;transform:scale(1.02)}}

/* ===== shared buttons ===== */
.tbtn{display:block;width:240px;margin:8px auto;padding:12px;background:linear-gradient(#151b2d,#0e1322);border:1px solid #33405f;color:#cfc8b4;font-size:15px;letter-spacing:3px;border-radius:4px;transition:.15s}
.tbtn:hover,.tbtn:active{border-color:#c8a44a;color:#e8dcc0;box-shadow:0 0 14px rgba(200,164,74,.25)}
.tbtn.gold{border-color:#7a6538;color:#f0dca0;background:linear-gradient(#2a2010,#18120a)}
.choice-btn{background:linear-gradient(#151b2d,#0e1322);border:1px solid #33405f;color:#cfc8b4;padding:11px 12px;border-radius:5px;font-size:13px;text-align:left;line-height:1.5;width:100%}
.choice-btn small{display:block;color:#7f8aa5;font-size:10px;margin-top:3px}
.choice-btn:hover,.choice-btn:active{border-color:#c8a44a}
.choice-btn:disabled{opacity:.4;pointer-events:none}

/* ===== title ===== */
#screen-title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 90%,#1a1408 0%,#0a0b12 45%,#03040a 100%)}
#title-art{width:136px;height:300px;margin-bottom:-8px;filter:drop-shadow(0 0 20px #000)}
#title-art svg{width:100%;height:100%;border-radius:6px;-webkit-mask-image:radial-gradient(ellipse 60% 55% at 50% 45%,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse 60% 55% at 50% 45%,#000 60%,transparent 100%)}
#title-main{font-size:40px;letter-spacing:10px;color:#b8a878;text-shadow:0 0 24px rgba(200,160,60,.35),0 2px 2px #000;margin:4px 0 2px}
#title-sub{font-size:14px;color:#6d7690;letter-spacing:4px;margin-bottom:4px}
#title-name{font-size:12px;color:#8d3a3a;letter-spacing:2px;margin-bottom:18px}
#title-igen{margin-top:16px;font-size:12px;color:#8a7a4f;white-space:pre-wrap;line-height:1.7}

/* ===== story ===== */
#screen-story{background:#03040a;justify-content:flex-end}
#story-bg{position:absolute;inset:0;transition:background 1s}
#story-bg svg{width:100%;height:58%;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
#story-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 0%,rgba(0,0,0,.78) 92%);pointer-events:none}
#story-port{position:absolute;left:50%;top:4%;transform:translateX(-50%);display:flex;align-items:flex-start;justify-content:center;filter:drop-shadow(0 0 22px rgba(0,0,0,.9))}
#story-port .full{width:min(56vw,250px,27vh);aspect-ratio:200/440}
#story-port .bust{width:min(62vw,260px);aspect-ratio:200/240;margin-top:6vh}
#story-port .full svg,#story-port .bust svg{width:100%;height:100%;border-radius:6px}
#story-port .bust svg{-webkit-mask-image:radial-gradient(ellipse 55% 52% at 50% 45%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 55% 52% at 50% 45%,#000 62%,transparent 100%)}
#story-port .bigmoji{font-size:96px;margin-top:12vh;filter:brightness(.82) sepia(.2)}
#story-box{position:relative;margin:0 12px 22px;background:rgba(8,10,18,.93);border:1px solid #2a3450;border-radius:6px;padding:14px 16px 30px;min-height:124px;cursor:pointer;z-index:3}
#story-speaker{color:#c8a44a;font-size:13px;letter-spacing:2px;margin-bottom:8px;min-height:16px}
#story-text{font-size:15px;line-height:1.85;white-space:pre-wrap}
#story-hint{position:absolute;right:14px;bottom:8px;font-size:11px;color:#5b6684;animation:flick 1.6s infinite}
#story-skip{position:absolute;top:10px;right:10px;background:rgba(10,14,26,.8);border:1px solid #2a3450;color:#7f8aa5;font-size:11px;padding:5px 12px;border-radius:4px;z-index:5}

/* ===== map (night school floor plan) ===== */
#screen-map{background:
  linear-gradient(rgba(70,100,170,.07) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,rgba(70,100,170,.07) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(180deg,#04050c 0%,#080d1c 55%,#04050c 100%)}
#map-head{text-align:center;padding:12px 8px 4px;position:relative}
#map-floor{font-size:17px;letter-spacing:5px;color:#9aa5c2;text-shadow:0 0 12px rgba(120,140,200,.3)}
#map-floor-sub{font-size:11px;color:#5b6684;margin-top:3px;letter-spacing:2px}
#map-exit{position:absolute;right:10px;top:10px;background:#1f8a4a;color:#e8fff0;font-size:9px;padding:2px 6px;box-shadow:0 0 12px rgba(58,255,138,.5);font-family:sans-serif}
#map-scroll{flex:1;overflow-y:auto;padding:22px 0 40px;position:relative}
#map-corridor{position:relative;width:min(90%,440px);margin:0 auto;display:flex;flex-direction:column-reverse;gap:30px;padding:10px 0}
#map-corridor::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:150px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(50,65,110,.18) 15%,rgba(50,65,110,.18) 85%,transparent);border-left:1px solid #1d2742;border-right:1px solid #1d2742}
.map-step{display:flex;justify-content:center;gap:44px;position:relative;z-index:2}
.map-step.fork::before{content:"";position:absolute;top:50%;left:50%;width:170px;height:0;border-top:1px dashed #2c3a5c;transform:translateX(-50%)}
.map-node{width:84px;text-align:center;position:relative;cursor:default;transition:transform .2s}
.map-node .door{width:64px;height:74px;margin:0 auto;position:relative}
.map-node .door svg{width:100%;height:100%}
.map-node .door .ic{position:absolute;left:50%;top:15px;transform:translateX(-50%);font-size:17px;filter:drop-shadow(0 0 4px rgba(0,0,0,.8))}
.map-node .mn-label{font-size:10px;color:#7f8aa5;display:block;margin-top:3px;letter-spacing:1px;line-height:1.35}
.map-node .mn-label b{font-weight:normal;color:#aab4cc}
.map-node.done{opacity:.3}
.map-node.locked{opacity:.6}
.map-node.locked .door .ic{opacity:.5}
.map-node.avail{cursor:pointer}
.map-node.avail .door{animation:doorglow 2.2s infinite}
.map-node.avail:active{transform:scale(.96)}
.map-node.avail .mn-label b{color:#f0d8a0}
.map-node.boss-node{width:130px}.map-node.boss-node .door{width:120px;height:96px}
.map-node.dojo-node .door{width:80px;height:74px}
@keyframes doorglow{0%,100%{filter:drop-shadow(0 0 6px rgba(240,170,60,.35))}50%{filter:drop-shadow(0 0 14px rgba(240,170,60,.75))}}
.map-you{position:absolute;left:50%;transform:translateX(-50%);bottom:-20px;font-size:11px;color:#c8a44a;white-space:nowrap;letter-spacing:1px}

/* ===== battle ===== */
#screen-battle{background:#05060b;--slotH:clamp(66px,12.2vh,104px);--qH:calc(var(--slotH)*.52);--cw:76px;--ch:100px}
#screen-battle.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,0)}}
#b-scene{position:relative;flex:1 1 auto;min-height:104px;overflow:hidden}
#b-bg{position:absolute;inset:0}
#b-bg svg{width:100%;height:100%}
#b-fig{position:absolute;left:50%;bottom:-6%;height:112%;aspect-ratio:200/240;transform:translateX(-50%);
  -webkit-mask-image:radial-gradient(ellipse 52% 50% at 50% 46%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 52% 50% at 50% 46%,#000 55%,transparent 100%);transition:filter .6s}
#b-fig svg{width:100%;height:100%}
#b-fig.p2{filter:drop-shadow(0 0 10px #f02010) saturate(1.5) contrast(1.15)}
#b-fig.hit{animation:fighit .35s}
@keyframes fighit{0%{filter:brightness(2.4)}100%{filter:none}}
#b-scenefade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.25),transparent 30%,transparent 62%,#05060b 100%);pointer-events:none}
#b-namebar{position:absolute;left:10px;top:7px;right:90px;text-shadow:0 0 6px #000,0 0 3px #000}
#b-ename{font-size:14px;letter-spacing:2px;color:#e0c890}
#b-especial{font-size:9.5px;color:#d8907a;margin-top:2px;line-height:1.4}
#b-ecandles{position:absolute;right:10px;top:6px;font-size:15px;letter-spacing:2px}
#b-counters{position:absolute;right:8px;top:28px;display:flex;gap:3px;justify-content:flex-end}
#b-counters i{width:17px;height:17px;border-radius:50%;border:1.5px solid #b02020;color:#e04040;font-size:8px;font-style:normal;display:flex;align-items:center;justify-content:center;background:rgba(40,0,0,.55)}
#b-counters i.off{opacity:.3}
#b-counters span{font-size:10px;color:#e07060;text-shadow:0 0 4px #000}
#b-bubble{position:absolute;left:16px;right:16px;bottom:6px;padding:6px 10px;font-size:11.5px;line-height:1.55;color:#e8dcc8;background:rgba(8,6,10,.84);border:1px solid #5a3a3a;border-radius:4px;text-align:center;min-height:30px}
#b-bubble:empty{display:none}

#b-desk{position:relative;flex:none;padding:6px 8px 4px;
  background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(0,0,0,.12) 22px 23px),
    repeating-linear-gradient(0deg,rgba(255,220,160,.03) 0 3px,rgba(0,0,0,.05) 3px 7px),
    linear-gradient(#3a2614,#24170c 55%,#140c06);
  box-shadow:inset 0 14px 30px rgba(0,0,0,.8);border-top:3px solid #5a3e22}
#b-desk::before{content:"";position:absolute;left:-40px;top:40%;width:220px;height:220px;background:radial-gradient(circle,rgba(255,170,70,.18),transparent 65%);pointer-events:none}
#b-desk::after{content:"";position:absolute;right:-50px;top:0;width:200px;height:200px;background:radial-gradient(circle,rgba(255,170,70,.12),transparent 65%);pointer-events:none}
.lane-label{font-size:9px;color:#a07060;letter-spacing:1px;margin:0 0 2px 2px;height:11px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:5px;position:relative;z-index:1}
.slot{position:relative;height:var(--slotH);border:1.5px dashed rgba(230,220,200,.2);border-radius:5px;display:flex;align-items:stretch;justify-content:stretch;transition:background .15s,border-color .15s}
.qrow .slot{height:var(--qH);border-style:dotted;border-color:rgba(200,120,110,.28)}
.slot.droppable{border-color:#e8c060;background:rgba(232,192,96,.12);cursor:pointer;box-shadow:0 0 12px rgba(232,192,96,.25) inset}
.slot.targetable{border-color:#e05a4a;background:rgba(224,90,74,.14);cursor:pointer}
.slot.hover{background:rgba(255,230,160,.25)}
.slot>.pc{flex:1}

/* parchment card */
.pc{position:relative;border-radius:4px;padding:3px 3px 2px;background:linear-gradient(#efe4c8,#d6c6a0);
  box-shadow:0 3px 8px rgba(0,0,0,.7),inset 0 0 12px rgba(120,90,40,.35);color:#2a1c10;display:flex;flex-direction:column;align-items:center;font-size:10px;transition:transform .18s}
.pc::before{content:"";position:absolute;inset:2px;border:1px solid rgba(60,40,20,.5);border-radius:3px;pointer-events:none}
.pc.en{background:linear-gradient(#d8d0dc,#aea2b6)}
.pc.conv{background:linear-gradient(#e0e8f0,#b4c4d4)}
.pc.grad{background:linear-gradient(#f4e8c0,#d8bc78);box-shadow:0 0 10px rgba(240,200,90,.4),0 3px 8px rgba(0,0,0,.7)}
.pc.curse{background:linear-gradient(#cfc0b8,#9a8a84)}
.pc .seal{position:absolute;left:-6px;top:-7px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e04a3a,#8a1410);color:#ffe8d0;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #000;z-index:2}
.pc .tbm{position:absolute;right:2px;top:2px;width:13px;height:13px;border-radius:50%;border:1px solid #a82020;color:#a82020;font-size:7.5px;display:flex;align-items:center;justify-content:center;opacity:.85}
.pc .nm{font-size:9px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 10px 0 6px;margin-top:1px;line-height:1.2}
.pc .art{flex:1 1 auto;width:86%;min-height:14px;margin-top:2px;border-radius:2px;background:radial-gradient(#5a4a36,#1e160e);display:flex;align-items:center;justify-content:center;font-size:22px;filter:sepia(.3) saturate(.85);box-shadow:inset 0 0 8px #000;overflow:hidden}
.pc.en .art{background:radial-gradient(#4a3e56,#140e1c)}
.pc .sig{font-size:7.5px;color:#6a3a20;line-height:1.15;margin-top:1px;text-align:center;max-height:18px;overflow:hidden}
.pc .st{width:100%;display:flex;justify-content:space-between;font-size:12px;font-weight:bold;padding:0 3px;line-height:1.15}
.pc .st .a::before{content:"⚔";font-size:8px;margin-right:1px;color:#8a3a20}
.pc .st .h::before{content:"♥";font-size:8px;margin-right:1px;color:#8a2030}
.pc .st .buff{color:#b04010}.pc .st .hurt{color:#a01020}
.pc.mini{opacity:.72}.pc.mini .nm{font-size:7.5px;padding:0 2px}.pc.mini .art{font-size:15px}.pc.mini .sig{display:none}.pc.mini .st{font-size:10px}
.pc.stunned{filter:grayscale(1) brightness(.6)}
.pc.stunned::after{content:"💫";position:absolute;top:-8px;right:-4px;font-size:14px}
.pc.atk-up{transform:translateY(-18px) scale(1.06);z-index:5}
.pc.atk-down{transform:translateY(18px) scale(1.06);z-index:5}
.pc.hitflash{animation:hitflash .3s}
.pc.dying{animation:dying .4s forwards}
.pc.guard{box-shadow:0 0 10px rgba(230,190,60,.7),0 3px 8px rgba(0,0,0,.7)}
.pc.big{width:110px;height:146px}.pc.big .nm{font-size:11px}.pc.big .art{font-size:34px}.pc.big .sig{font-size:9px;max-height:34px}.pc.big .st{font-size:15px}
.pc.mid{width:var(--cw);height:var(--ch)}
.pc .desc{font-size:7.6px;line-height:1.2;color:#4a3420;text-align:center;margin-top:1px;max-height:28px;overflow:hidden;padding:0 2px}
.pc.big .desc{font-size:9px;max-height:46px}
@keyframes hitflash{0%{filter:brightness(2.6) saturate(0)}100%{filter:none}}
@keyframes dying{to{opacity:0;transform:scale(.6) rotate(8deg)}}

.fpop{position:absolute;left:50%;top:30%;transform:translateX(-50%);color:#f0d090;font-size:12px;white-space:nowrap;pointer-events:none;text-shadow:0 0 6px #000,0 2px 2px #000;animation:fpop 1s forwards;z-index:40;font-weight:bold}
@keyframes fpop{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1}80%{opacity:1;transform:translate(-50%,-14px)}100%{opacity:0;transform:translate(-50%,-22px)}}

/* middle strip: message + scale */
#b-mid{display:flex;align-items:center;gap:8px;min-height:46px;position:relative;z-index:1}
#b-msg{flex:1;font-size:10.5px;color:#cbbf9f;line-height:1.45;text-shadow:0 1px 2px #000}
#b-scale{position:relative;width:150px;height:46px;flex:none}
#b-scale .post{position:absolute;left:71px;top:8px;width:8px;height:36px;background:linear-gradient(90deg,#8a6a28,#e0b860,#8a6a28);border-radius:2px}
#b-scale .base{position:absolute;left:55px;top:42px;width:40px;height:4px;background:#8a6a28;border-radius:2px}
#b-scale .beam{position:absolute;left:8px;right:8px;top:8px;height:4px;background:linear-gradient(#e0b860,#8a6a28);border-radius:2px;transition:transform .6s cubic-bezier(.3,1.5,.5,1);box-shadow:0 2px 4px #000}
#b-scale .pan{position:absolute;top:0;width:48px;height:15px;border-radius:0 0 24px 24px;background:linear-gradient(#c89a40,#6a4a14);box-shadow:0 3px 6px #000;transition:top .6s cubic-bezier(.3,1.5,.5,1)}
#b-scale .pan.l{left:0}#b-scale .pan.r{right:0}
#b-scale .pan .lb{position:absolute;top:15px;left:0;right:0;text-align:center;font-size:8px;color:#a89a7a}
#b-scale .chalk{position:absolute;bottom:9px;width:8px;height:4px;background:#f0ece0;border-radius:1px;box-shadow:0 1px 1px #000}
#b-scale .chalk.drop{animation:chalkdrop .45s cubic-bezier(.5,0,.8,.6)}
@keyframes chalkdrop{from{transform:translateY(-40px) rotate(40deg);opacity:0}60%{opacity:1}to{transform:none}}

/* hud */
#b-hud{display:flex;align-items:center;gap:7px;position:relative;z-index:2;margin-top:2px}
#b-face{width:46px;height:46px;flex:none;border-radius:50%;overflow:hidden;border:2px solid #7a5a2a;box-shadow:0 0 10px rgba(0,0,0,.9);background:#0a0d18}
#b-face svg{width:100%;height:100%}
#screen-battle.awakened #b-face{border-color:#d03020;animation:awpulse 1.4s infinite}
@keyframes awpulse{50%{box-shadow:0 0 18px rgba(230,60,40,.95)}}
#b-stats{font-size:10.5px;line-height:1.45;min-width:0}
#b-energy{color:#f0c860;font-size:12px}
#b-instinct{color:#e05a40;font-size:10px}
#b-deckn{color:#a89a7a;font-size:9.5px}
#b-items{display:flex;gap:4px;margin-left:auto}
.item{width:34px;height:34px;border-radius:50%;border:1.5px solid #7a6538;background:radial-gradient(#3a2c14,#1a1208);display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;box-shadow:0 2px 6px #000;position:relative}
.item.empty{border-style:dashed;opacity:.35;cursor:default}
.item.sel{border-color:#f0c860;box-shadow:0 0 12px rgba(240,200,96,.8)}
#b-bell{flex:none;width:58px;height:46px;border:none;border-radius:50% 50% 8px 8px;background:radial-gradient(circle at 40% 30%,#f0d080,#8a6420);color:#2a1a08;font-size:10px;font-weight:bold;line-height:1.15;padding-top:8px;box-shadow:0 3px 8px #000}
#b-bell:active{transform:translateY(1px)}
#b-bell:disabled{filter:grayscale(.8) brightness(.6);pointer-events:none}

/* hand (fanned) */
#b-hand{position:relative;height:calc(var(--ch) + 14px);margin-top:4px;touch-action:none;z-index:3}
#b-hand .hc{position:absolute;bottom:0;width:var(--cw);height:var(--ch);transition:left .2s,transform .15s,bottom .15s;touch-action:none;cursor:grab}
#b-hand .hc>.pc{width:100%;height:100%}
#b-hand .hc.sel{bottom:12px;z-index:20}
#b-hand .hc.sel>.pc{box-shadow:0 0 14px rgba(240,200,96,.85),0 3px 8px #000}
#b-hand .hc.poor>.pc{filter:brightness(.62) saturate(.6)}
#b-hand .hc.dragging{opacity:.25}
#ghost{position:fixed;z-index:200;pointer-events:none;width:var(--cw,76px);height:var(--ch,100px);transform:translate(-50%,-60%) rotate(-4deg) scale(1.08);filter:drop-shadow(0 10px 14px rgba(0,0,0,.8))}
#ghost>.pc{width:100%;height:100%}

/* draw choice */
#b-draw{position:absolute;left:0;right:0;bottom:0;height:calc(var(--ch) + 14px);display:none;align-items:center;justify-content:center;gap:16px;z-index:10;background:linear-gradient(transparent,rgba(5,4,2,.85) 30%)}
#b-draw.show{display:flex}

@keyframes fadein{from{opacity:0}to{opacity:1}}

#cutin{position:absolute;inset:0;z-index:95;display:none;overflow:hidden;background:rgba(0,0,0,.7)}

#cutin .band{position:absolute;left:-20%;right:-20%;top:28%;height:44%;transform:rotate(-7deg);background:linear-gradient(90deg,#1a0406,#5a0c0c 45%,#1a0406);box-shadow:0 0 0 2px #c8a44a,0 0 40px #000;overflow:hidden}
#cutin .band::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(255,255,255,.035) 30px 32px);animation:bandmove .8s linear infinite}
@keyframes bandmove{to{transform:translateX(32px)}}
#cutin .por{position:absolute;right:3%;top:50%;width:min(46vw,280px);margin-top:calc(min(46vw,280px)*-.6);aspect-ratio:200/240;animation:slidein .45s cubic-bezier(.2,1.4,.4,1);z-index:2}
#cutin .por svg{width:100%;height:100%;border:2px solid #c8a44a;border-radius:4px;box-shadow:0 0 30px #000}
#cutin .txt{position:absolute;left:5%;top:50%;transform:translateY(-50%);width:48%;z-index:3;animation:slidein2 .5s ease-out}
#cutin .nm{font-size:22px;letter-spacing:4px;color:#f4e0b0;text-shadow:0 0 12px #000,0 2px 2px #000;line-height:1.3}
#cutin .ln{font-size:12px;color:#e8d0c0;margin-top:10px;line-height:1.7;text-shadow:0 0 6px #000}
#cutin .tag{font-size:10px;color:#e06050;letter-spacing:3px;margin-bottom:6px}
@keyframes slidein{from{transform:translateX(120%)}to{transform:none}}
@keyframes slidein2{from{opacity:0;margin-left:-40%}to{opacity:1;margin-left:0}}

#overlay-detail{position:absolute;inset:0;z-index:85;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(2,3,8,.86);padding:20px;gap:14px}

#od-card .pc{transform:scale(1.35);transform-origin:center bottom;margin-top:40px}

#choice-list{display:flex;flex-direction:column;gap:8px;width:min(94%,380px)}

/* ===== shop ===== */
#screen-shop{background:radial-gradient(ellipse at 50% 0%,#1a1410 0%,#05060c 70%);overflow-y:auto;align-items:center;padding:10px 10px}

#shop-face svg{width:100%;height:100%;border-radius:6px;-webkit-mask-image:radial-gradient(ellipse 58% 54% at 50% 48%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 58% 54% at 50% 48%,#000 62%,transparent 100%)}
#shop-name{font-size:13px;color:#c8b478;letter-spacing:2px;text-align:center}

.shop-item .si-icon{font-size:24px;flex:none;width:34px;text-align:center}
.shop-item .si-body{flex:1;min-width:0}
.shop-item .si-name{font-size:12px;color:#e0d8c0}
.shop-item .si-desc{font-size:10px;color:#8a8270;line-height:1.4}
.shop-item .si-buy{flex:none;background:#241c0c;border:1px solid #7a6538;color:#e8c76a;font-size:12px;padding:7px 10px;border-radius:5px;white-space:nowrap}
.shop-item .si-buy:disabled{opacity:.4;pointer-events:none}
.shop-item.soldout{opacity:.4}

/* ===== event ===== */
#screen-event{background:radial-gradient(ellipse at 50% 20%,#0e1420 0%,#04050b 75%);align-items:center;justify-content:center;padding:16px;overflow-y:auto}
#event-box{width:min(96%,400px);background:rgba(8,10,18,.95);border:1px solid #2a3450;border-radius:8px;padding:18px 16px;text-align:center}
#event-icon{font-size:44px;filter:saturate(.7) brightness(.85)}
#event-title{font-size:16px;color:#c8b478;letter-spacing:3px;margin:8px 0}
#event-text{font-size:12.5px;color:#aab2c8;line-height:1.9;margin-bottom:16px;white-space:pre-wrap;text-align:left}
#event-choices{display:flex;flex-direction:column;gap:8px}

/* ===== game over ===== */
#screen-over{background:radial-gradient(ellipse at 50% 40%,#140a0a 0%,#030307 75%);align-items:center;justify-content:center;text-align:center;padding:20px}
#over-main{font-size:26px;letter-spacing:6px;color:#a04030;text-shadow:0 0 20px rgba(160,40,20,.5)}
#over-sub{font-size:12px;color:#8a93ad;margin:18px 0 26px;line-height:2;white-space:pre-wrap}

@media (max-height:700px){

}

  #screen-battle{--slotH:62px;--cw:62px;--ch:82px}

}

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function addIgen(n){ save.igen=Math.max(0,save.igen+n); commitSave(); updateTopbar(); }

const ART = {};
(function(){
let seq = 0;
ART.nid = p => p + (++seq) + "_";
ART.rng = seed => { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; };

/* film grain + vignette + candle flame gradients, shared by every picture */
ART.common = P => `

    <feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="1" seed="11" stitchTiles="stitch"/>

  <filter id="${P}blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <filter id="${P}glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <radialGradient id="${P}vig" cx=".5" cy=".48" r=".75">

  <linearGradient id="${P}wax" x1="0" x2="1"><stop offset="0" stop-color="#f3e6c8"/><stop offset="1" stop-color="#b8a684"/></linearGradient>`;

ART.finish = (P, w, h, grain = .35) => `

/* scatter of tiny dots inside an ellipse (stubble, embers, dust) */
ART.dots = (seed, n, cx, cy, rx, ry, r, fill, op) => {

};

      e += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="${R() < .5 ? "#ff8a2a" : "#ffd060"}" opacity="${(.4 + R() * .6).toFixed(2)}"/>`;
    }
    o.push(`<g filter="url(#${P}glow)">${e}</g>`);
  }
  o.push(`<rect width="200" height="440" fill="url(#${P}warm)" style="mix-blend-mode:soft-light"/>`);
  o.push(ART.candle(P, 18, 432, .9, 40));
  o.push(ART.finish(P, 200, 440));
  return ART.svg(200, 440, o.join(""));
};

function jonesState(){
  if (!B) return "released";
  if (B.e.id === "tutorial" || B.e.id === "police") return "young";
  return B.instinct >= 3 ? "awakened" : "released";
}
function portraitSVG(key){
  if (!key) return "";
  if (key.startsWith("boss:")) return ART.boss[key.slice(5)]();
  if (key.startsWith("shadow:")) { const [, eyes, hat] = key.split(":"); return ART.shadow(eyes, hat); }
  return "";
}
const unitCost = k => EU[k] ? EU[k].cost : CARDS[k].cost;
const stopped = () => !B || B.over || B.halt;
const canAct = () => B && !B.busy && !B.over && !B.halt && !B.mustDraw;

function newPUnit(cid){
  const c = CARDS[cid];
  const up = (run && run.upgrades[cid]) || 0;
  return {uid:uidc++, cid, n:c.n, icon:c.icon, atk:c.atk + up + (B ? B.instinct : 0), hp:c.hp + up, mhp:c.hp + up,
          tb:!!c.tb, ab:(c.ab || []).slice(), stun:0, enemy:false, grad:!!c.grad};
}
function newEUnit(eid, bonusAtk){
  const d = EU[eid] || CARDS[eid];
  return {uid:uidc++, cid:eid, n:d.n, icon:d.icon, atk:d.atk + (bonusAtk || 0), hp:d.hp, mhp:d.hp,
          tb:!!d.tb, ab:(d.ab || []).slice(), stun:0, enemy:true};
}

function startBattle(enemyId, opts){
  opts = opts || {};
  const e = ENEMIES[enemyId];
  B = { e, opts, over:false, busy:true, halt:false,
        p:[null,null,null,null], en:[null,null,null,null], q:[null,null,null,null],
        deck:shuffle(run.deck.slice()), hand:[], discard:[],
        turn:1, energy:0, scale:0, instinct:0, phase:1,
        ctConvert:0, ctRecord:0, ctHide:0, enInstinct:enemyId === "hiroshi" ? 1 : 0,
        mustDraw:false, sel:-1, pend:null, itemSel:-1, chalk:{side:0, n:0}, faceState:"" };
  showScreen("screen-battle");
  $("b-bg").innerHTML = ART.bg[SCENE_OF(e)]();
  $("b-fig").innerHTML = portraitSVG(PORTRAIT[enemyId] || "shadow:#ffd060:");
  $("b-fig").className = "";
  $("b-ename").textContent = e.n;
  $("b-especial").textContent = e.special || "";
  $("b-bubble").textContent = "";
  msg("");
  for (let i = 0; i < 3; i++) drawCard();
  B.hand.push("nafuda");
  if (enemyId === "kaicho") B.en[1] = newEUnit("kocho");
  if (enemyId === "tutorial") { B.en[1] = newEUnit("student1"); B.en[2] = newEUnit("student2"); }
  spawnQueue(1, false);
  renderBattle();
  (async () => {
    if (e.boss) await cutIn(e, e.intro);
    if (!B) return;
    bubble(enemyId === "kaicho" ? "校長「わ、私は悪くない…すべて時代がそうさせたんです…」" : e.intro);
    if (enemyId === "shunin") { await sleep(700); stealHand("「開始前に、持ち物検査だ」"); }
    startPlayerTurn();
  })();
}

function drawCard(){
  if (B.hand.length >= 8) return false;
  if (B.deck.length === 0) {
    if (B.discard.length === 0) { B.hand.push("nafuda"); return true; }
    B.deck = shuffle(B.discard); B.discard = [];
  }
  B.hand.push(B.deck.pop());
  return true;
}

function startPlayerTurn(){
  if (!B || B.over) return;
  B.energy = Math.min(B.turn, 6);
  for (const u of B.p) if (u && u.ab.includes("energize")) B.energy++;
  B.sel = -1; B.pend = null; B.itemSel = -1; B.busy = false;
  B.mustDraw = B.turn > 1 && B.hand.length < 8;
  if (B.e.id === "tutorial") tutorialHint();
  else if (B.e.id === "police") msg("(……この威圧感。勝てる気がしない)");
  else msg(B.mustDraw ? "山札か名札、どちらから1枚引く?" : "カードを置くか、ベルを鳴らして授業を終えよう。");
  renderBattle();
}

function chooseDraw(kind){
  if (!B || !B.mustDraw || B.busy) return;
  if (kind === "deck") drawCard(); else B.hand.push("nafuda");
  B.mustDraw = false;
  if (B.e.id === "tutorial") tutorialHint(); else msg("カードを置くか、ベルを鳴らして授業を終えよう。");
  renderBattle();
}

/* ---------- small fx ---------- */
function typeText(el, text, speed = 26){
  const tok = (el._tw || 0) + 1; el._tw = tok; el._full = text; el._typing = true;
  el.textContent = "";
  return new Promise(res => {
    let i = 0;
    const step = () => {
      if (el._tw !== tok) return res();
      i = Math.min(text.length, i + 1);
      el.textContent = text.slice(0, i);
      if (i >= text.length) { el._typing = false; return res(); }
      setTimeout(step, text[i - 1] === "\n" || text[i - 1] === "。" ? speed * 5 : speed);
    };
    step();
  });
}
function finishType(el){ if (el._typing) { el._tw++; el._typing = false; el.textContent = el._full; return true; } return false; }
function bubble(t){ if (t) typeText($("b-bubble"), t, 32); else { $("b-bubble")._tw = ($("b-bubble")._tw || 0) + 1; $("b-bubble").textContent = ""; } }
function msg(t){ $("b-msg").textContent = t || ""; }
function fpop(el, text, color){
  if (!el) el = $("b-desk");
  const d = document.createElement("div");
  d.className = "fpop"; d.textContent = text;
  if (color) d.style.color = color;
  el.appendChild(d);
  setTimeout(() => d.remove(), 1050);
}
function shake(){ const s = $("screen-battle"); s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake"); }
function figHit(){ const f = $("b-fig"); f.classList.remove("hit"); void f.offsetWidth; f.classList.add("hit"); }
const uEl = u => u && $("u" + u.uid);
const uSlot = u => { const el = uEl(u); return el ? el.parentElement : null; };

function cutIn(e, line, p2){
  return new Promise(res => {
    const c = $("cutin");
    c.querySelector(".por").innerHTML = portraitSVG(PORTRAIT[e.id]);
    c.querySelector(".tag").textContent = p2 ? "── 第 二 形 態 ──" : e.final ? "── 最 終 決 戦 ──" : e.ura ? "── 裏 ボ ス ──" : "── 中 ボ ス ──";
    c.querySelector(".nm").textContent = e.n;
    c.className = "show";
    typeText(c.querySelector(".ln"), line, 28);
    let t;
    const done = () => { c.className = ""; c.onclick = null; clearTimeout(t); res(); };
    t = setTimeout(done, 3000);
    c.onclick = done;
  });
}

function banner(main, sub, red, dur){
  return new Promise(res => {
    $("banner-main").textContent = main;
    $("banner-sub").textContent = sub || "";
    const b = $("banner");
    b.className = "show" + (red ? " red" : "");
    setTimeout(() => { b.className = ""; res(); }, dur || 1800);
  });
}

/* ---------- card elements ---------- */
function sigText(ab){ return (ab || []).map(a => "◆" + AB_TEXT[a]).join(" "); }
function cardEl(cid, size){
  const c = CARDS[cid];
  const up = (run && run.upgrades[cid]) || 0;
  const d = document.createElement("div");
  d.className = "pc" + (size ? " " + size : "") + (c.grad ? " grad" : "") + (c.curse ? " curse" : "");
  const body = c.kind === "u"
    ? `${c.ab && c.ab.length ? `<div class="sig">${sigText(c.ab)}</div>` : ""}<div class="st"><span class="a">${c.atk + up}</span><span class="h">${c.hp + up}</span></div>`
    : `<div class="desc">${esc(c.desc || "")}</div>`;
  d.innerHTML = `<div class="seal">${c.cost}</div>${c.tb ? `<div class="tbm">罰</div>` : ""}
    <div class="nm">${esc(c.n)}${up ? "+" + up : ""}</div><div class="art">${c.icon}</div>${body}`;
  return d;
}
function unitCardEl(u, mini){
  const d = document.createElement("div");
  const base = u.enemy ? null : CARDS[u.cid];
  d.className = "pc" + (u.enemy ? (u.conv ? " conv" : " en") : "") + (u.grad ? " grad" : "") + (mini ? " mini" : "") + (u.stun > 0 ? " stunned" : "") + (u.ab.includes("guard") ? " guard" : "");
  d.id = "u" + u.uid;
  const ac = base && u.atk > base.atk + ((run && run.upgrades[u.cid]) || 0) ? "buff" : "";
  const hc = u.hp < u.mhp ? "hurt" : "";
  d.innerHTML = `${!u.enemy && u.tb ? `<div class="tbm">罰</div>` : ""}<div class="nm">${esc(u.n)}</div><div class="art">${u.icon}</div>
    ${u.ab.length ? `<div class="sig">${sigText(u.ab)}</div>` : ""}<div class="st"><span class="a ${ac}">${u.atk}</span><span class="h ${hc}">${u.hp}</span></div>`;
  return d;
}

/* ---------- render ---------- */
function renderBattle(){
  if (!B) return;
  $("screen-battle").classList.toggle("awakened", B.instinct >= 3);
  renderSlots(); renderHand(); renderHud(); renderScale(); renderCounters();
  updateTopbar();
}

let suppressClick = 0;
function bindLongPress(el, fn){
  let t = null;
  const clear = () => { clearTimeout(t); t = null; };
  el.addEventListener("pointerdown", () => { clear(); t = setTimeout(() => { suppressClick = Date.now(); guardDetail(); fn(); }, 430); });
  el.addEventListener("pointerup", clear);
  el.addEventListener("pointerleave", clear);
  el.addEventListener("pointercancel", clear);
  el.addEventListener("contextmenu", ev => { ev.preventDefault(); if (!t && $("overlay-detail").classList.contains("show")) return; clear(); suppressClick = Date.now(); fn(); });
}

function validTarget(side, lane, pend){
  if (!pend) return false;
  if (pend.target === "eunit") { const u = side === "e" && B.en[lane]; return !!u && (!pend.tfilter || pend.tfilter(u)); }
  if (pend.target === "punit") return side === "p" && !!B.p[lane];
  return false;
}
function hasTarget(target, tfilter){
  const pool = target === "eunit" ? B.en : B.p;
  return pool.some(u => u && (!tfilter || tfilter(u)));
}

function renderSlots(){
  const rows = [["q-slots", "q", B.q], ["e-slots", "e", B.en], ["p-slots", "p", B.p]];
  const selUnit = B.sel >= 0 && B.hand[B.sel] && CARDS[B.hand[B.sel]].kind === "u";
  for (const [id, side, arr] of rows) {
    const box = $(id); box.innerHTML = "";
    for (let i = 0; i < 4; i++) {
      const s = document.createElement("div");
      s.className = "slot"; s.id = side + "s" + i;
      s.dataset.side = side; s.dataset.lane = i;
      const u = arr[i];
      if (u) {
        const el = unitCardEl(u, side === "q");
        bindLongPress(el, () => showUnitDetail(u));
        s.appendChild(el);
      }
      if (side === "p" && selUnit && !u) s.classList.add("droppable");
      if (side !== "q" && validTarget(side, i, B.pend)) s.classList.add("targetable");
      s.onclick = () => slotClick(side, i);
      box.appendChild(s);
    }
  }
}

function renderHand(){
  if (drag) return;
  const h = $("b-hand"); h.innerHTML = "";
  const cs = getComputedStyle($("screen-battle"));
  const cw = parseFloat(cs.getPropertyValue("--cw")) || 76;
  const W = h.clientWidth || 360, n = B.hand.length;
  const step = n > 1 ? Math.min(cw + 6, (W - cw - 4) / (n - 1)) : 0;
  const left0 = (W - (cw + step * (n - 1))) / 2;
  B.hand.forEach((cid, idx) => {
    const w = document.createElement("div");
    w.className = "hc" + (idx === B.sel ? " sel" : "") + (CARDS[cid].cost > B.energy ? " poor" : "");
    w.style.left = (left0 + idx * step) + "px";
    w.style.transform = `rotate(${((idx - (n - 1) / 2) * 2.4).toFixed(1)}deg)`;
    w.style.zIndex = idx + 1;
    w.appendChild(cardEl(cid));
    bindHandCard(w, idx);
    h.appendChild(w);
  });
}

function renderHud(){
  $("b-energy").textContent = "⚡気合 " + B.energy;
  $("b-instinct").textContent = B.instinct > 0 ? "👹本能 " + "●".repeat(Math.min(B.instinct, 6)) + (B.instinct >= 3 ? " 覚醒" : "") : "";
  $("b-deckn").textContent = "山札 " + B.deck.length + " / 捨札 " + B.discard.length;
  const fs = jonesState();
  if (B.faceState !== fs) { $("b-face").innerHTML = faceSVG(fs); B.faceState = fs; }
  const items = $("b-items"); items.innerHTML = "";
  const its = (run && run.items) || [];
  for (let i = 0; i < 3; i++) {
    const k = its[i];
    const d = document.createElement("div");
    d.className = "item" + (k ? "" : " empty") + (B.itemSel === i ? " sel" : "");
    if (k) {
      d.textContent = ITEMS[k].icon;
      d.onclick = () => { if (Date.now() - suppressClick > 500) selectItem(i); };
      bindLongPress(d, () => showItemDetail(k));
    }
    items.appendChild(d);
  }
  $("b-bell").disabled = !canAct();
  $("b-draw").classList.toggle("show", !!B.mustDraw && !B.busy);
  $("pile-deck-n").textContent = (B.deck.length + B.discard.length) + "枚";
  $("pile-deck").classList.toggle("empty", B.deck.length + B.discard.length === 0);
}

function renderScale(){
  const s = B.scale;
  const ang = -s * 4.5;
  const rad = ang * Math.PI / 180;
  document.querySelector("#b-scale .beam").style.transform = `rotate(${ang}deg)`;
  $("pan-e").style.top = (4 - 67 * Math.sin(rad)) + "px";
  $("pan-p").style.top = (4 + 67 * Math.sin(rad)) + "px";
  const side = s > 0 ? 1 : s < 0 ? -1 : 0, n = Math.abs(s);
  const prev = B.chalk;
  const pos = [[8,9],[19,9],[30,9],[13,13],[25,13]];
  for (const [pan, sd] of [["pan-e", 1], ["pan-p", -1]]) {
    const el = $(pan);
    el.querySelectorAll(".chalk").forEach(c => c.remove());
    if (side !== sd) continue;
    for (let i = 0; i < Math.min(n, 5); i++) {
      const c = document.createElement("div");
      c.className = "chalk" + ((prev.side !== sd || i >= prev.n) ? " drop" : "");
      c.style.left = pos[i][0] + "px"; c.style.bottom = pos[i][1] + "px";
      el.appendChild(c);
    }
  }
  B.chalk = {side, n};
}

function renderCounters(){
  const e = B.e, box = $("b-counters");
  let h = "";
  if (e.id === "kaicho") {
    for (let i = 0; i < 3; i++) h += `<i class="${i < B.ctRecord ? "" : "off"}">記</i>`;
    if (B.instinct >= 3) h = `<span>指導記録:覚醒により無効</span>`;
  }
  if (e.id === "hiroshi") h = `<span>👹敵の本能 ${"●".repeat(B.enInstinct)}</span>`;
  if (e.id === "shunin") { const iv = B.phase === 2 ? 2 : 3, k = (iv - B.turn % iv) % iv; h = `<span>持ち物検査:${k === 0 ? "このターン終了時" : "あと" + k + "ターン"}</span>`; }
  if (e.id === "counselor") { const iv = B.phase === 2 ? 2 : 3, k = iv - (B.ctConvert % iv); h = `<span>傾聴:${k === 1 ? "このターン終了時" : "あと" + k + "ターン"}</span>`; }
  box.innerHTML = h;
  $("b-ecandles").innerHTML = e.p2 ? (B.phase === 1 ? '<span class="candle-lit">🕯</span><span class="candle-lit">🕯</span>' : '<span class="candle-lit">🕯</span><span class="candle-out">🕯</span>') : "";
}

/* ---------- detail overlay ---------- */
function openDetail(cardNode, html){
  const c = $("od-card"); c.innerHTML = ""; c.appendChild(cardNode);
  $("od-text").innerHTML = html;
  $("overlay-detail").classList.add("show");
}
/* a long-press opens the detail while the finger is still down; ignore the tap synthesized on release */
let detailGuard = 0;
const guardDetail = () => { detailGuard = Infinity; };
for (const ev of ["pointerup", "pointercancel"]) window.addEventListener(ev, () => { if (detailGuard === Infinity) detailGuard = Date.now() + 450; }, true);
function closeDetail(){ if (Date.now() < detailGuard) return; detailGuard = 0; $("overlay-detail").classList.remove("show"); }
function abHtml(ab){ return (ab || []).map(a => `<div class="ab">◆${AB_TEXT[a]}:${AB_DESC[a]}</div>`).join(""); }
function showCardDetail(cid){
  const c = CARDS[cid]; if (!c) return;
  const up = (run && run.upgrades[cid]) || 0;
  openDetail(cardEl(cid, "big"), `<h3>${esc(c.n)}${up ? " +" + up : ""}</h3>
    <div>コスト ⚡${c.cost} ${c.kind === "u" ? `/ ⚔${c.atk + up} ♥${c.hp + up}` : "/ 呪文"} ${c.tb ? "/ <span style='color:#e06050'>体罰カード</span>" : "/ 補助カード"}</div>
    ${c.desc ? `<div>${esc(c.desc)}</div>` : ""}${abHtml(c.ab)}<div class="fl">${esc(c.fl || "")}</div>`);
}
function showUnitDetail(u){
  const fl = (CARDS[u.cid] && !u.enemy) ? CARDS[u.cid].fl : "";
  openDetail(unitCardEl(u), `<h3>${esc(u.n)}</h3><div>⚔${u.atk} ♥${u.hp}/${u.mhp}${u.stun > 0 ? " / 💫行動不能" : ""}${u.enemy ? " / 敵" : ""}</div>${abHtml(u.ab)}${fl ? `<div class="fl">${esc(fl)}</div>` : ""}`);
}
function showItemDetail(k){
  const it = ITEMS[k];
  const d = document.createElement("div"); d.className = "item"; d.style.cssText = "width:70px;height:70px;font-size:36px;margin-top:20px"; d.textContent = it.icon;
  openDetail(d, `<h3>${it.n}</h3><div>${it.desc}</div><div class="fl">使い切りアイテム。タップで使用。</div>`);
}

/* ---------- drag & drop / tap ---------- */
let drag = null;
function bindHandCard(el, idx){
  el.addEventListener("pointerdown", ev => {
    if (ev.button) return;
    ev.preventDefault();
    const st = {idx, el, x0:ev.clientX, y0:ev.clientY, moved:false, lp:false, ghost:null, ok:false};
    drag = st;
    try { el.setPointerCapture(ev.pointerId); } catch (_) {}
    st.timer = setTimeout(() => { if (drag === st && !st.moved) { st.lp = true; guardDetail(); showCardDetail(B.hand[idx]); } }, 430);
  });
  el.addEventListener("pointermove", ev => {
    const st = drag; if (!st || st.el !== el) return;
    if (!st.moved) {
      if (st.lp || Math.hypot(ev.clientX - st.x0, ev.clientY - st.y0) < 9) return;
      st.moved = true; clearTimeout(st.timer);
      st.ok = beginDrag(st);
    }
    if (st.ghost) { st.ghost.style.left = ev.clientX + "px"; st.ghost.style.top = ev.clientY + "px"; hoverAt(ev.clientX, ev.clientY); }
  });
  el.addEventListener("pointerup", ev => endPointer(ev, el, false));
  el.addEventListener("pointercancel", ev => endPointer(ev, el, true));
  el.addEventListener("contextmenu", ev => ev.preventDefault());
}
function beginDrag(st){
  if (!canAct()) { if (B && B.mustDraw) msg("先にカードを1枚引け。"); return false; }
  const cid = B.hand[st.idx], c = CARDS[cid];
  if (c.cost > B.energy) { msg(`気合が足りない…(⚡${c.cost}必要)`); return false; }
  if (c.kind === "s" && c.target !== "none" && !hasTarget(c.target, c.tfilter)) { msg("対象にできるカードが場にない。"); return false; }
  B.sel = st.idx; B.itemSel = -1;
  B.pend = c.kind === "s" && c.target !== "none" ? {idx:st.idx, target:c.target, tfilter:c.tfilter} : null;
  renderSlots();
  st.el.classList.add("dragging");
  const g = document.createElement("div"); g.id = "ghost";
  const cs = getComputedStyle($("screen-battle"));
  g.style.setProperty("--cw", cs.getPropertyValue("--cw")); g.style.setProperty("--ch", cs.getPropertyValue("--ch"));
  g.appendChild(cardEl(cid));
  g.style.left = st.x0 + "px"; g.style.top = st.y0 + "px";
  document.body.appendChild(g); st.ghost = g;
  msg(c.kind === "u" ? "空いている光るマスへ放せ。" : c.target === "none" ? "机の上で放すと使用。" : "対象のカードの上で放せ。");
  return true;
}
function hoverAt(x, y){
  const hit = document.elementFromPoint(x, y);
  const slot = hit && hit.closest(".slot");
  document.querySelectorAll(".slot.hover").forEach(s => { if (s !== slot) s.classList.remove("hover"); });
  if (slot && (slot.classList.contains("droppable") || slot.classList.contains("targetable"))) slot.classList.add("hover");
}
function endPointer(ev, el, cancelled){
  const st = drag; if (!st || st.el !== el) return;
  drag = null; clearTimeout(st.timer);
  if (st.ghost) st.ghost.remove();
  document.querySelectorAll(".slot.hover").forEach(s => s.classList.remove("hover"));
  if (st.lp) { renderBattle(); return; }
  if (!st.moved) { if (!cancelled) selectHand(st.idx); return; }
  if (!st.ok || cancelled || !B) { if (B) { B.sel = -1; B.pend = null; renderBattle(); } return; }
  const hit = document.elementFromPoint(ev.clientX, ev.clientY);
  const slot = hit && hit.closest(".slot");
  const c = CARDS[B.hand[st.idx]];
  if (c.kind === "u") {
    if (slot && slot.dataset.side === "p" && !B.p[+slot.dataset.lane]) return void placeUnit(+slot.dataset.lane, st.idx);
  } else if (c.target === "none") {
    if (hit && hit.closest("#b-desk,#b-scene") && !hit.closest("#b-hand")) return void castSpell(st.idx, null, null);
  } else if (slot && validTarget(slot.dataset.side, +slot.dataset.lane, B.pend)) {
    return void castSpell(st.idx, slot.dataset.side, +slot.dataset.lane);
  }
  B.sel = -1; B.pend = null; msg("");
  renderBattle();
}

function selectHand(idx){
  if (!canAct()) { if (B && B.mustDraw) msg("先にカードを1枚引け。"); return; }
  const cid = B.hand[idx], c = CARDS[cid];
  B.itemSel = -1;
  if (B.sel === idx) { B.sel = -1; B.pend = null; msg(""); renderBattle(); return; }
  if (c.cost > B.energy) { msg(`気合が足りない…(⚡${c.cost}必要)`); return; }
  B.sel = idx; B.pend = null;
  if (c.kind === "s") {
    if (c.target === "none") { castSpell(idx, null, null); return; }
    if (!hasTarget(c.target, c.tfilter)) { msg("対象にできるカードが場にない。"); B.sel = -1; renderBattle(); return; }
    B.pend = {idx, target:c.target, tfilter:c.tfilter};
    msg(c.target === "eunit" ? "対象の敵カードを選べ。" : "対象の味方カードを選べ。");
  } else msg("置きたいマスを選べ。(もう一度タップで解除/長押しで詳細)");
  renderBattle();
}

function slotClick(side, lane){
  if (Date.now() - suppressClick < 600) return;
  if (!canAct()) return;
  if (side === "p" && B.sel >= 0 && CARDS[B.hand[B.sel]].kind === "u" && !B.p[lane]) return void placeUnit(lane);
  if (B.pend && validTarget(side, lane, B.pend)) {
    if (B.pend.item) return void useItem(B.pend.itemIdx, side, lane);
    return void castSpell(B.pend.idx, side, lane);
  }
}

async function afterAction(){
  if (!B) return;
  if (B.halt && !B.over) await phaseTwo();
  if (B && !B.over) { B.busy = false; renderBattle(); }
}

async function placeUnit(lane, idx){
  if (idx === undefined) idx = B.sel;
  if (!canAct() || idx < 0) return;
  const cid = B.hand[idx], c = CARDS[cid];
  if (c.kind !== "u" || B.p[lane] || c.cost > B.energy) return;
  B.busy = true;
  B.energy -= c.cost;
  B.hand.splice(idx, 1); B.sel = -1; B.pend = null;
  const u = newPUnit(cid);
  B.p[lane] = u;
  onPlayerCardPlayed(c);
  for (const a of B.p) if (a && a !== u && a.ab.includes("rally")) a.atk++;
  if (u.ab.includes("buddy") && B.hand.length < 8) { B.hand.push(cid); fpop($("b-hand"), "相棒を呼んだ!"); }
  msg("");
  renderBattle();
  fpop($("ps" + lane), c.n);
  await sleep(220);
  if (u.ab.includes("haste") && !stopped()) await unitAttack(u, lane, true);
  await afterAction();
}

async function castSpell(idx, side, lane){
  if (!canAct()) return;
  const cid = B.hand[idx], c = CARDS[cid];
  if (c.cost > B.energy) return;
  B.busy = true;
  B.energy -= c.cost;
  B.hand.splice(idx, 1); B.sel = -1; B.pend = null;
  B.discard.push(cid);
  onPlayerCardPlayed(c);
  msg("");
  const t = side === "e" ? B.en[lane] : side === "p" ? B.p[lane] : null;
  const tS = t ? uSlot(t) : null;
  renderBattle();
  switch (cid) {
    case "rouka": t.stun = Math.max(t.stun, 1); fpop(tS, "廊下に立ってろ!"); break;
    case "seiza": t.atk = Math.max(0, t.atk - 2); fpop(tS, "正座三時間 ⚔-2"); break;
    case "ground":
      fpop(tS, "グラウンド100周!");
      await killUnit(t);
      B.energy += 2; fpop(null, "⚡+2", "#e8c76a"); break;
    case "hansei": drawCard(); drawCard(); fpop(null, "反省文:2枚ドロー"); break;
    case "shukudai": for (const u of B.en) if (u) u.atk = Math.max(0, u.atk - 1); fpop(null, "宿題三倍:敵全体⚔-1"); break;
    case "team": for (const u of B.p) if (u) { u.hp += 2; u.mhp += 2; } fpop(null, "チームワーク指導:味方♥+2"); break;
    case "aisek": fpop(tS, "愛の説教!"); await damageUnit(t, 2); break;
    case "kiai": t.atk++; t.hp++; t.mhp++; fpop(tS, "気合注入 +1/+1"); break;
    case "album": {
      const tbs = REWARD_POOL.filter(k => CARDS[k].kind === "u" && CARDS[k].tb);
      for (let i = 0; i < 2 && B.hand.length < 8; i++) B.hand.push(rnd(tbs));
      fpop(null, "卒業アルバム:体罰カードを手に"); break; }
    case "osu": B.energy++; drawCard(); fpop(null, "押忍! ⚡+1 & 1枚ドロー"); break;
    case "chorei": for (const u of B.p) if (u) { u.atk++; u.hp++; u.mhp++; } fpop(null, "全校朝礼:味方全体+1/+1"); break;
    case "tokkun":
      fpop(null, "放課後特訓:総攻撃!");
      await sleep(300);
      for (let i = 0; i < 4; i++) { if (stopped()) break; if (B.p[i]) await unitAttack(B.p[i], i, true); }
      break;
    case "encho": fpop(tS, "延長授業!"); await unitAttack(t, lane, true); break;
    case "taigaku": fpop(tS, "退学届……"); await killUnit(t); break;
    case "honno": {
      B.instinct++;
      for (const u of B.p) if (u) u.atk++;
      for (const u of B.p) if (u && u.ab.includes("feral")) { u.atk++; fpop(uSlot(u), "血脈 ⚔+1", "#e05040"); }
      if (B.e.id === "kaicho" && B.ctRecord > 0) { B.ctRecord = 0; fpop(null, "指導記録が消し飛んだ!", "#c86a5a"); }
      if (B.instinct === 3) {
        renderBattle();
        await banner("覚 醒", "本能の力が全身を駆け巡る──\nネクタイを額に巻いた。もう誰にも止められない。", true, 1900);
      } else fpop(null, "本能の力 +1 (計" + B.instinct + ")", "#e05040");
      break; }
    case "curse": fpop(null, "『うちの子に限って!』…何も起きなかった。"); break;
  }
  await afterAction();
}

function onPlayerCardPlayed(c){
  if (B.e.id === "kaicho" && c.tb && B.instinct < 3) { B.ctRecord++; fpop($("b-scene"), "📋 指導記録 +1", "#e07060"); }
}

/* ---------- items ---------- */
function selectItem(i){
  if (!canAct()) { if (B && B.mustDraw) msg("先にカードを1枚引け。"); return; }
  const k = run.items[i]; if (!k) return;
  const it = ITEMS[k];
  B.sel = -1; B.pend = null;
  if (B.itemSel === i) { B.itemSel = -1; msg(""); renderBattle(); return; }
  if (it.target === "none") { useItem(i, null, null); return; }
  if (!hasTarget(it.target)) { msg("対象にできるカードが場にない。"); renderBattle(); return; }
  B.itemSel = i; B.pend = {item:true, itemIdx:i, target:it.target};
  msg(`${it.icon}${it.n}:対象の敵カードを選べ。`);
  renderBattle();
}
async function useItem(i, side, lane){
  if (!canAct()) return;
  const k = run.items[i]; if (!k) return;
  B.busy = true;
  run.items.splice(i, 1); B.itemSel = -1; B.pend = null;
  saveRun();
  const t = side === "e" ? B.en[lane] : null, tS = t ? uSlot(t) : null;
  msg(""); renderBattle();
  switch (k) {
    case "akapen": fpop(tS, "赤ペン:バツ!", "#e05040"); await damageUnit(t, 2); break;
    case "hasami": fpop(tS, "没収!", "#e05040"); await killUnit(t); break;
    case "whistle": for (const u of B.en.concat(B.q)) if (u) u.stun = Math.max(u.stun, 1); fpop(null, "ピーーーッ!! 全員、気をつけ!"); break;
    case "shussekibo": drawCard(); drawCard(); fpop(null, "出席簿:2枚ドロー"); break;
    case "bento": B.energy += 3; fpop(null, "手作り弁当:⚡+3", "#e8c76a"); break;
    case "chalkbox": tiltScale(1); fpop($("b-scale"), "チョークを1本乗せた", "#e8c76a"); renderBattle(); checkEnd(); break;
  }
  await afterAction();
}

/* ---------- combat resolution ---------- */
function getTargets(u, lane, opp){
  if (u.ab.includes("sweep")) {
    const out = [];
    for (const l of [lane - 1, lane, lane + 1]) if (l >= 0 && l < 4) out.push({lane:l, unit:opp[l]});
    return out;
  }
  if (u.ab.includes("snipe")) {
    let best = null, bl = -1;
    for (let l = 0; l < 4; l++) { const t = opp[l]; if (t && (!best || t.hp < best.hp)) { best = t; bl = l; } }
    if (best) return [{lane:bl, unit:best}];
  }
  return [{lane, unit:opp[lane]}];
}

async function damageUnit(t, dmg, srcUnit){
  if (!B || !t || dmg <= 0) return;
  t.hp -= dmg;
  const el = uEl(t);
  if (el) { el.classList.remove("hitflash"); void el.offsetWidth; el.classList.add("hitflash"); fpop(el.parentElement, "-" + dmg, "#ff6040"); const st = el.querySelector(".h"); if (st) { st.textContent = Math.max(0, t.hp); st.classList.add("hurt"); } }
  await sleep(200);
  if (t.hp <= 0) await killUnit(t);
  else if (srcUnit && t.ab.includes("counter") && srcUnit.hp > 0) {
    fpop(uSlot(srcUnit), "返り討ち!", "#c8a44a");
    srcUnit.hp -= 2;
    if (srcUnit.hp <= 0) await killUnit(srcUnit);
  }
}

async function killUnit(t){
  if (!B || !t) return;
  const el = uEl(t);
  if (el) { el.classList.add("dying"); await sleep(300); }
  if (!B) return;
  const arr = t.enemy ? (B.en.includes(t) ? B.en : B.q) : B.p;
  const i = arr.indexOf(t);
  if (i >= 0) arr[i] = null;
  for (const a of (t.enemy ? B.en : B.p)) if (a && a.ab.includes("fighter")) { a.atk++; fpop(uSlot(a), "闘魂 ⚔+1", "#e0956a"); }
  if (t.ab.includes("legacy") && !t.enemy) { drawCard(); fpop($("b-hand"), "形見:1枚ドロー", "#e8c76a"); }
  if (t.cid === "kocho") { bubble("校長「ひ、ひぃぃ…! も、もう庇いきれません…!」"); fpop($("b-scene"), "忖度の壁が崩れた!", "#e8c76a"); }
  renderBattle();
}

function tiltScale(n){ B.scale = Math.max(-5, Math.min(5, B.scale + n)); }

async function faceDamage(attacker, dmg){
  if (!B || dmg <= 0) return;
  if (!attacker.enemy) {
    const g = B.en.find(u => u && u.ab.includes("guard"));
    if (g) { fpop(uSlot(g), "忖度!肩代わり", "#e8c76a"); await damageUnit(g, dmg, attacker); return; }
    tiltScale(dmg); figHit();
    fpop($("b-scene"), "本体に " + dmg + " ダメージ!", "#f0d080");
  } else {
    tiltScale(-dmg); shake();
    fpop($("b-mid"), "こちらに " + dmg + " ダメージ…", "#ff5040");
  }
  renderBattle();
  await sleep(260);
  checkEnd();
}

function tryNullify(u){
  if (u.enemy) return false;
  if (B.e.id === "police" && Math.random() < 0.9) return "「公務執行妨害だ」…無効化された!";
  if (B.e.id === "kaicho" && u.tb && B.instinct < 3 && Math.random() < (B.phase === 2 ? 0.5 : 0.35)) return "会長「記録済みだ」…攻撃が無効化された!";
  return false;
}

async function unitAttack(u, lane, isHaste){
  if (stopped() || !u || u.hp <= 0) return;
  if (u.stun > 0) { if (!isHaste) { u.stun--; renderBattle(); } return; }
  const opp = u.enemy ? B.p : B.en;
  const times = u.ab.includes("double") ? 2 : 1;
  for (let k = 0; k < times; k++) {
    if (stopped() || u.hp <= 0) break;
    let atkVal = u.atk;
    if (u.ab.includes("pack")) {
      const side = u.enemy ? B.en : B.p, li = side.indexOf(u);
      let adj = 0;
      if (li > 0 && side[li - 1]) adj++;
      if (li >= 0 && li < 3 && side[li + 1]) adj++;
      if (adj) { atkVal += adj; fpop(uSlot(u), "組立 ⚔+" + adj, "#e0956a"); }
    }
    if (atkVal <= 0) break;
    const el = uEl(u);
    if (el) el.classList.add(u.enemy ? "atk-down" : "atk-up");
    await sleep(190);
    const nul = tryNullify(u);
    if (nul) {
      fpop(el && el.parentElement, "無効化!", "#9ab0d8"); msg(nul);
      if (el) el.classList.remove("atk-down", "atk-up");
      await sleep(250); continue;
    }
    for (const t of getTargets(u, lane, opp)) {
      if (stopped()) break;
      if (t.unit && t.unit.hp > 0) {
        const over = atkVal - t.unit.hp;
        await damageUnit(t.unit, atkVal, u);
        if (u.ab.includes("trample") && over > 0 && !stopped()) await faceDamage(u, over);
      } else await faceDamage(u, atkVal);
    }
    if (el) el.classList.remove("atk-down", "atk-up");
    await sleep(110);
  }
}

/* ---------- turn flow ---------- */
async function ringBell(){
  if (!canAct()) { if (B && B.mustDraw) msg("先にカードを1枚引け。"); return; }
  B.busy = true; B.sel = -1; B.pend = null; B.itemSel = -1;
  renderBattle();
  msg("── 攻撃 ──");
  for (let i = 0; i < 4; i++) { if (stopped()) break; if (B.p[i]) await unitAttack(B.p[i], i, false); }
  if (!B || B.over) return;
  if (B.halt) { await phaseTwo(); if (!B || B.over) return; }
  await sleep(250);
  await enemyTurn();
  if (!B || B.over) return;
  if (B.halt) { await phaseTwo(); if (!B || B.over) return; }
  B.turn++;
  startPlayerTurn();
}

async function enemyTurn(){
  const e = B.e;
  msg("── 相手のターン ──");
  if (Math.random() < 0.7) bubble(rnd(e.quotes));
  renderBattle();
  await sleep(380);

  if (e.id === "shunin" && B.turn % (B.phase === 2 ? 2 : 3) === 0 && B.hand.length > 0) {
    stealHand(B.phase === 2 ? "主任「抜き打ちだ。動くな」" : "主任「定期検査の時間だ」");
    renderBattle(); await sleep(550);
  }
  if (e.id === "counselor") {
    B.ctConvert++;
    if (B.ctConvert % (B.phase === 2 ? 2 : 3) === 0) {
      const cands = []; B.p.forEach((u, i) => { if (u && u.tb) cands.push(i); });
      const freeE = [0,1,2,3].filter(i => !B.en[i]), freeQ = [0,1,2,3].filter(i => !B.q[i]);
      if (cands.length && (freeE.length || freeQ.length)) {
        cands.sort((a, b) => B.p[b].atk - B.p[a].atk);
        const i = Math.random() < 0.6 ? cands[0] : rnd(cands);
        const u = B.p[i]; B.p[i] = null;
        u.enemy = true; u.conv = true;
        u.n = CONVERT_NAMES[u.cid] || ("更生した" + u.n);
        u.icon = "🕊"; u.hp = u.mhp; u.stun = 0;
        if (freeE.length) B.en[rnd(freeE)] = u; else B.q[rnd(freeQ)] = u;
        bubble("「ほら…あなたは本当は、優しい子」");
        renderBattle();
        fpop(uSlot(u), "傾聴:寝返った!", "#b090e0");
        await sleep(750);
      }
    }
  }
  if (e.id === "nushi") {
    if (B.scale > -2) { tiltScale(-1); fpop($("b-scale"), "静養:傾きが戻された…", "#80d0a8"); }
    if (B.phase === 2) for (const u of B.en) if (u && u.hp < u.mhp) { u.hp = u.mhp; fpop(uSlot(u), "全快", "#80d0a8"); }
    renderBattle(); await sleep(450);
    if (checkEnd()) return;
  }
  if (e.id === "kaicho") {
    B.ctHide++;
    if (B.ctHide % 2 === 0 && B.en.some(u => u && u.cid === "kocho")) {
      const cands = B.p.filter(u => u);
      if (cands.length) {
        const u = rnd(cands);
        u.stun = Math.max(u.stun, 1);
        bubble("校長「な、なかったことに…しましょう…ね?」");
        renderBattle();
        fpop(uSlot(u), "隠蔽体質:行動不能!", "#b090e0");
        await sleep(600);
      }
    }
    if (B.ctRecord >= 3 && B.instinct < 3) {
      B.ctRecord = 0;
      await banner("委員会の制裁", "「指導記録3件。……処分を執行する」", true, 1300);
      let best = null;
      for (const u of B.p) if (u && (!best || u.atk > best.atk)) best = u;
      if (best) { fpop(uSlot(best), "処分執行!", "#ff5040"); await killUnit(best); }
      await faceDamage({enemy:true}, 2);
      if (stopped()) return;
      renderBattle();
    }
  }
  if (e.id === "hiroshi" && B.turn % (B.phase === 2 ? 2 : 3) === 0) {
    B.enInstinct++;
    for (const u of B.en.concat(B.q)) if (u) u.atk++;
    bubble("「本能が…滾るのう…!」");
    renderBattle();
    fpop($("b-scene"), "敵の本能 +1!", "#ff5040");
    await sleep(600);
  }

  /* queued cards step forward */
  let moved = false;
  for (let i = 0; i < 4; i++) if (B.q[i] && !B.en[i]) { B.en[i] = B.q[i]; B.q[i] = null; moved = true; }
  if (moved) { renderBattle(); await sleep(380); }

  for (let i = 0; i < 4; i++) { if (stopped()) return; if (B.en[i]) await unitAttack(B.en[i], i, false); }
  if (stopped()) return;

  if (e.id === "police" && B.turn >= 3) { await policeArrest(); return; }
  await spawnQueue(B.turn + 1, true);
}

async function spawnQueue(t, anim){
  const e = B.e;
  let budget = e.curve[Math.min(t - 1, e.curve.length - 1)] + (B.phase === 2 ? 1 : 0);
  let tries = 10;
  while (budget > 0 && tries-- > 0) {
    const free = [0,1,2,3].filter(i => !B.q[i]);
    if (!free.length) break;
    const aff = e.pool.filter(k => unitCost(k) <= budget);
    if (!aff.length) break;
    const pick = rnd(aff);
    budget -= unitCost(pick);
    const facingEmpty = free.filter(l => !B.p[l]);
    const lane = (facingEmpty.length && Math.random() < 0.6) ? rnd(facingEmpty) : rnd(free);
    B.q[lane] = newEUnit(pick, e.id === "hiroshi" ? B.enInstinct : 0);
    if (anim) { renderBattle(); fpop($("qs" + lane), B.q[lane].n); await sleep(240); }
  }
  if (anim) renderBattle();
}

function stealHand(t){
  if (!B || B.hand.length === 0) return;
  const i = Math.floor(Math.random() * B.hand.length);
  const cid = B.hand.splice(i, 1)[0];
  bubble(t);
  fpop($("b-hand"), "没収! ─ " + CARDS[cid].n, "#ff5040");
  renderBattle();
}

function checkEnd(){
  if (!B) return true;
  if (B.over || B.halt) return true;
  if (B.scale >= 5) {
    if (B.e.p2 && B.phase === 1) { B.halt = true; return true; }
    B.over = true; setTimeout(winBattle, 400); return true;
  }
  if (B.scale <= -5) { B.over = true; setTimeout(loseBattle, 400); return true; }
  return false;
}

async function phaseTwo(){
  const e = B.e;
  B.busy = true;
  await banner("ろうそくが一本、消えた", e.n + "の様子が変わった……", true, 1700);
  if (!B) return;
  B.halt = false; B.phase = 2;
  B.en = [null,null,null,null]; B.q = [null,null,null,null];
  B.scale = 0;
  if (e.id === "hiroshi") B.enInstinct += 2;
  $("b-fig").classList.add("p2");
  $("b-especial").textContent = e.p2.special;
  renderBattle();
  await cutIn(e, e.p2.line, true);
  if (!B) return;
  bubble(e.p2.line);
  msg("盤面が一掃された。天秤も元通りだ。");
}

async function policeArrest(){
  B.over = true;
  await banner("現 行 犯 逮 捕", "無数の手錠が、教壇の男に殺到した。\n\n※これはイベント戦闘です。この敗北にペナルティはありません。", true, 3000);
  B = null;
  playStory(ST_ARREST, () => { save.prologueDone = true; commitSave(); beginRun(); });
}

async function winBattle(){
  const e = B.e, opts = B.opts;
  await banner("勝 利", e.boss ? "「これが、俺の授業だ」" : "「次の授業も、覚悟しておけ」", false, 1500);
  const gained = e.igen || 20;
  B = null;
  addIgen(gained);
  if (opts.onWin) { opts.onWin(gained); return; }
  if (e.id === "tutorial") { playStory(ST_POLICE, () => startBattle("police")); return; }
  if (e.id === "kaicho") {
    save.cleared = true; save.wins++; commitSave();
    playStory(ST_ENDING, () => { run.bossDone = true; saveRun(); renderMap(); showScreen("screen-map"); });
    return;
  }
  if (e.id === "hiroshi") {
    save.trueCleared = true; save.wins++; commitSave();
    clearRun();
    playStory(ST_TRUE_ENDING, () => { run = null; toTitle(); });
    return;
  }
  let note = "威厳 +" + gained + "。";
  if (e.boss || opts.bonus) { const it = grantItem(); if (it) note += `アイテム『${ITEMS[it].icon}${ITEMS[it].n}』を入手。`; }
  if (e.boss) showReward(ELITE_POOL, "中ボス撃破!", note + "\n強力なカードを1枚選べ。", () => advanceStep());
  else showReward(REWARD_POOL, "勝利", note + "\n戦利品のカードを1枚選べ。", () => advanceStep());
}

async function loseBattle(){
  const e = B.e, opts = B.opts;
  if (e.id === "police") { await policeArrest(); return; }
  if (e.id === "tutorial") {
    await banner("居 眠 り 完 遂", "……生徒たちに敗北した。教育のやり直しだ。", true, 2000);
    startBattle("tutorial", {}); return;
  }
  B = null;
  if (opts.onLose) { opts.onLose(); return; }
  run.candles--;
  saveRun(); updateTopbar();
  if (run.candles > 0) {
    await banner("敗 北", "ろうそくが一本、消えた……\n(残り " + "🕯".repeat(run.candles) + ")\n\nだが、まだ授業は終わらない。再戦だ。", true, 2400);
    startBattle(e.id, opts);
  } else {
    await banner("敗 北", "最後のろうそくが、消えた。", true, 2000);
    runOver();
  }
}


/* =========================================================
   RUN / MAP
   ========================================================= */
const AREAS = [
  { name:"1F ─ 昇降口と教室棟", sub:"非常灯だけが灯る、静まり返った廊下。", elite:"shunin", eliteRoom:"昇降口前",
    enemies:["fukiA","mihariA"], rooms:["1年A組","1年B組","1年C組","昇降口","購買部前","用具室"] },
  { name:"2F ─ 特別教室棟", sub:"理科室から、フラスコの音がした気がする。", elite:"counselor", eliteRoom:"相談室",
    enemies:["ptaB","yutoB"], rooms:["理科室","音楽室","図書室","美術室","家庭科室","視聴覚室"] },
  { name:"3F ─ 職員室エリア", sub:"廊下の最奥、校長室の扉から光が漏れている。", elite:"nushi", eliteRoom:"保健室",
    enemies:["shineiC","mikkokuC"], rooms:["職員室前","印刷室","放送室","会議室","資料室","更衣室"] }
];
const NODE_META = {
  battle:{icon:"⚔️", label:"戦闘"}, battleB:{icon:"🔥", label:"戦闘(報酬増)"}, card:{icon:"🃏", label:"カード獲得"},
  upgrade:{icon:"⬆️", label:"カード強化"}, shop:{icon:"🛒", label:"職員室ショップ"}, event:{icon:"❓", label:"???"},
  elite:{icon:"💀", label:"中ボス"}, boss:{icon:"", label:"ラスボス"}, dojo:{icon:"", label:"裏ボス"}, home:{icon:"🌅", label:"凱旋する"}
};

function mkNode(type, area){
  const a = AREAS[area - 1];
  const n = {type, room:rnd(a.rooms)};
  if (type === "battle" || type === "battleB") { n.enemy = rnd(a.enemies); n.bonus = (type === "battleB"); }
  if (type === "elite") { n.enemy = a.elite; n.room = a.eliteRoom; }
  if (type === "boss") n.room = "校長室";
  if (type === "dojo") n.room = "剣道場";
  if (type === "home") n.room = "校門";
  return n;
}
function genArea(area){
  const steps = [];
  const single = t => steps.push({nodes:[mkNode(t, area)], done:false});
  const pair = (a, b) => steps.push({nodes:[mkNode(a, area), mkNode(b, area)], done:false});
  single("battle");
  Math.random() < 0.5 ? pair("battleB", "card") : pair("battleB", "event");
  single(Math.random() < 0.5 ? "event" : "card");
  pair("shop", "upgrade");
  single("battle");
  Math.random() < 0.5 ? pair("event", "battleB") : pair("upgrade", "battleB");
  single("elite");
  if (area === 3) single("boss");
  return steps;
}

function grantItem(key){
  if (!run || run.items.length >= 3) return null;
  key = key || rnd(ITEM_KEYS);
  run.items.push(key);
  saveRun(); updateTopbar();
  return key;
}
function itemText(key){
  if (key) return `(${ITEMS[key].icon}『${ITEMS[key].n}』を入手)`;
  addIgen(10);
  return "(アイテム枠がいっぱいで持てなかった…代わりに威厳+10)";
}

function newRun(prologue){
  run = { deck:STARTER_DECK.slice(), candles:2, area:1, step:0, map:genArea(1), upgrades:{}, usedEvents:[],
          bossDone:false, items:prologue ? [] : [rnd(["akapen", "shussekibo"])], prologue:!!prologue };
}
function beginRun(){
  newRun(false);
  saveRun();
  updateTopbar();
  renderMap();
  showScreen("screen-map");
}

/* ---------- mid-run save ---------- */
function saveRun(){ try { if (run && !run.prologue) localStorage.setItem(RUN_KEY, JSON.stringify(run)); } catch (e) {} }
function clearRun(){ try { localStorage.removeItem(RUN_KEY); } catch (e) {} }
function loadRun(){ try { const r = JSON.parse(localStorage.getItem(RUN_KEY)); return r && r.deck ? r : null; } catch (e) { return null; } }
function continueRun(){
  const r = loadRun(); if (!r) return;
  run = r; run.items = run.items || [];
  updateTopbar(); renderMap(); showScreen("screen-map");
}

function renderMap(){
  const a = AREAS[run.area - 1];
  $("map-floor").textContent = "🏫 " + a.name;
  $("map-floor-sub").textContent = a.sub;
  const cor = $("map-corridor");
  cor.innerHTML = "";
  const steps = run.map.slice();
  if (run.bossDone) steps.push({nodes:[mkNode("dojo", 3), mkNode("home", 3)], done:false, dojoStep:true});
  steps.forEach((st, si) => {
    const row = document.createElement("div");
    row.className = "map-step" + (st.nodes.length > 1 ? " fork" : "");
    const isCurrent = run.bossDone ? !!st.dojoStep : (si === run.step);
    st.nodes.forEach(nd => {
      const m = NODE_META[nd.type];
      const el = document.createElement("div");
      el.className = "map-node" + (nd.type === "boss" ? " boss-node" : "") + (nd.type === "dojo" ? " dojo-node" : "");
      const lit = !st.done && (isCurrent || nd.type === "boss");
      if (st.done) el.classList.add("done");
      else if (isCurrent) { el.classList.add("avail"); el.onclick = () => enterNode(nd); }
      else el.classList.add("locked");
      el.innerHTML = `<div class="door">${ART.door(nd.type, lit)}${m.icon ? `<span class="ic">${m.icon}</span>` : ""}</div>
        <span class="mn-label"><b>${nd.room}</b><br>${m.label}</span>`;
      row.appendChild(el);
    });
    if (isCurrent && !st.done) {
      const you = document.createElement("div");
      you.className = "map-you"; you.textContent = "▲ 2G JONES";
      row.appendChild(you);
    }
    cor.appendChild(row);
  });
  setTimeout(() => { const av = cor.querySelector(".map-node.avail"); if (av) av.scrollIntoView({block:"center", behavior:"smooth"}); }, 60);
  saveRun();
  updateTopbar();
}

function enterNode(nd){
  switch (nd.type) {
    case "battle": case "battleB": startBattle(nd.enemy, {bonus:nd.bonus}); break;
    case "elite": startBattle(nd.enemy, {}); break;
    case "boss": startBattle("kaicho", {}); break;
    case "dojo":
      playStory([{bg:"scene:dojo", sp:"", tx:"軋む渡り廊下を渡ると、月明かりの剣道場。\n奥の掛け軸には、力強い二文字。\n\n──『本能』", port:"boss:hiroshi"}], () => startBattle("hiroshi", {}));
      break;
    case "home":
      clearRun();
      showScreen("screen-over");
      $("over-main").textContent = "─ 凱 旋 ─";
      $("over-sub").textContent = "委員会は去り、学校は静けさを取り戻した。\n2G JONESの授業は、明日も続く。\n\n(剣道場の亡霊は、まだ待っている……)";
      run = null; updateTopbar();
      break;
    case "card": showReward(REWARD_POOL, "🃏 落とし物のカード", "教室の机の中に、カードが挟まっていた。1枚選べ。", () => advanceStep()); break;
    case "upgrade": showUpgrade(() => advanceStep()); break;
    case "shop": openShop(); break;
    case "event": openEvent(); break;
  }
}

function advanceStep(){
  if (!run) return;
  if (run.bossDone) { renderMap(); showScreen("screen-map"); return; }
  run.map[run.step].done = true;
  run.step++;
  if (run.step >= run.map.length && run.area < 3) {
    run.area++; run.step = 0; run.map = genArea(run.area);
    saveRun();
    banner("─ " + AREAS[run.area - 1].name + " ─", AREAS[run.area - 1].sub, false, 1800).then(() => { renderMap(); showScreen("screen-map"); });
    return;
  }
  renderMap();
  showScreen("screen-map");
}

   REWARD / PICKERS
   ========================================================= */
const pickN = (pool, n) => shuffle([...new Set(pool)]).slice(0, n);
function choiceScreen(title, desc){
  showScreen("screen-choice");
  $("choice-title").textContent = title;
  $("choice-desc").textContent = desc;
  $("choice-cards").innerHTML = ""; $("choice-list").innerHTML = ""; $("choice-extra").innerHTML = "";
}
function choiceButton(html, fn){
  const b = document.createElement("button");
  b.className = "choice-btn"; b.innerHTML = html; b.onclick = fn;
  $("choice-list").appendChild(b);
  return b;
}
function pickableCard(cid, onPick, size){
  const el = cardEl(cid, size || "big");
  let lp = false;
  bindLongPress(el, () => { lp = true; showCardDetail(cid); });
  el.onclick = () => { if (lp || Date.now() - suppressClick < 600) { lp = false; return; } onPick(); };
  return el;
}

function showReward(pool, title, desc, cb){
  choiceScreen(title, desc + "\n(長押しでカード詳細)");
  let taken = false;
  pickN(pool, 3).forEach(cid => {
    $("choice-cards").appendChild(pickableCard(cid, () => {
      if (taken) return; taken = true;
      run.deck.push(cid); saveRun();
      fpop($("choice-title"), CARDS[cid].n + " を入手!", "#e8c76a");
      setTimeout(cb, 500);
    }));
  });
  choiceButton("受け取らない<small>デッキを薄く保つのも、また教育。</small>", cb);
}

function pickFromDeck(title, desc, filter, cb, cancelCb){
  choiceScreen(title, desc);
  run.deck.forEach((cid, idx) => {
    if (filter && !filter(cid)) return;
    $("choice-cards").appendChild(pickableCard(cid, () => cb(cid, idx), "mid"));
  });
  choiceButton("やめておく", cancelCb || (() => cb(null, -1)));
}

function showUpgrade(cb){
  pickFromDeck("⬆️ カード強化", "赤ペンで指導要録に書き込む。\n選んだ種類のカードは、このラン中ずっと +1/+1。",
    cid => CARDS[cid].kind === "u" && cid !== "nafuda",
    cid => { if (cid) { run.upgrades[cid] = (run.upgrades[cid] || 0) + 1; saveRun(); } cb(); },
    () => cb());
}

let shopState = null;
const priceOf = cid => CARDS[cid].grad ? 55 : ([25, 40, 65][CARDS[cid].r] || 25);

function openShop(){
  const cards = pickN(REWARD_POOL, 2).concat(pickN(ELITE_POOL, 1));
  shopState = { items:[
    ...cards.map(cid => ({kind:"card", cid, price:priceOf(cid), sold:false})),
    {kind:"item", key:rnd(ITEM_KEYS), price:20, sold:false},
    {kind:"manual", price:45, sold:false},
    {kind:"remove", price:30, sold:false},
    {kind:"candle", price:50, sold:false}
  ]};
  if (!$("shop-face").innerHTML) $("shop-face").innerHTML = ART.boss.obachan();
  typeText($("shop-quote"), rnd(SHOP_QUOTES), 30);
  renderShop();
  showScreen("screen-shop");
}
function renderShop(){
  const box = $("shop-items"); box.innerHTML = "";
  shopState.items.forEach((it, i) => {
    const d = document.createElement("div");
    d.className = "shop-item" + (it.sold ? " soldout" : "");
    let icon, name, desc;
    if (it.kind === "card") { const c = CARDS[it.cid]; icon = c.icon; name = c.n + (c.grad ? "(卒業生)" : ""); desc = (c.kind === "u" ? `⚔${c.atk}/♥${c.hp} ` : "") + (c.desc || sigText(c.ab)) + " ─ " + c.fl; }
    if (it.kind === "item") { const t = ITEMS[it.key]; icon = t.icon; name = t.n + "(アイテム)"; desc = t.desc + "。戦闘中にいつでも使える。"; }
    if (it.kind === "manual") { icon = "📔"; name = "絶版の生徒指導マニュアル"; desc = "カード1種類をこのラン中 +1/+1 に強化する。"; }
    if (it.kind === "remove") { icon = "🗑"; name = "カード除去サービス"; desc = "デッキから不要なカードを1枚、シュレッダーにかける。"; }
    if (it.kind === "candle") { icon = "🕯"; name = "赤い蝋燭"; desc = "消えたろうそくを灯し直す(残機全回復)。"; }
    d.innerHTML = `<div class="si-icon">${icon}</div><div class="si-body"><div class="si-name">${esc(name)}</div><div class="si-desc">${esc(desc)}</div></div>`;
    const btn = document.createElement("button");
    btn.className = "si-buy"; btn.textContent = "威厳 " + it.price;
    btn.disabled = it.sold || save.igen < it.price || (it.kind === "candle" && run.candles >= 2)
      || (it.kind === "remove" && run.deck.length <= 6) || (it.kind === "item" && run.items.length >= 3);
    btn.onclick = () => buyItem(i);
    d.appendChild(btn);
    if (it.kind === "card") bindLongPress(d, () => showCardDetail(it.cid));
    box.appendChild(d);
  });
}
function buyItem(i){
  const it = shopState.items[i];
  if (it.sold || save.igen < it.price) return;
  const q = t => typeText($("shop-quote"), t, 30);
  if (it.kind === "card") { addIgen(-it.price); it.sold = true; run.deck.push(it.cid); saveRun(); q("「まいどあり。大事に使いなよ」"); renderShop(); }
  else if (it.kind === "item") { if (!grantItem(it.key)) return; addIgen(-it.price); it.sold = true; q("「それ、先生が昔没収したやつだよ。……覚えてないかい?」"); renderShop(); }
  else if (it.kind === "candle") { addIgen(-it.price); it.sold = true; run.candles = 2; saveRun(); q("「火の始末にゃ、気をつけな」"); renderShop(); updateTopbar(); }
  else if (it.kind === "manual") {
    pickFromDeck("📔 生徒指導マニュアル", "強化するカードの種類を選べ(+1/+1)。", cid => CARDS[cid].kind === "u",
      cid => { if (cid) { addIgen(-it.price); it.sold = true; run.upgrades[cid] = (run.upgrades[cid] || 0) + 1; saveRun(); } renderShop(); showScreen("screen-shop"); });
  } else if (it.kind === "remove") {
    pickFromDeck("🗑 カード除去", "シュレッダーにかけるカードを選べ。", null,
      (cid, idx) => { if (cid !== null && idx >= 0) { addIgen(-it.price); it.sold = true; run.deck.splice(idx, 1); saveRun(); } renderShop(); showScreen("screen-shop"); });
  }
}
function leaveShop(){ advanceStep(); }
