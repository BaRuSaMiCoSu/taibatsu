/* ---------- drag & drop / tap ---------- */
let drag = null;
function bindHandCard(el, idx){
  el.addEventListener("pointerdown", ev => {
    if (ev.button) return;
    ev.preventDefault();
    const st = {idx, el, x0:ev.clientX, y0:ev.clientY, moved:false, lp:false, ghost:null, ok:false};
    drag = st;
    try { el.setPointerCapture(ev.pointerId); } catch (_) {}
    st.timer = setTimeout(() => { if (drag === st && !st.moved) { st.lp = true; guardDetail(); showCardDetail(B.hand[idx]); } }, 430);
  });
  el.addEventListener("pointermove", ev => {
    const st = drag; if (!st || st.el !== el) return;
    if (!st.moved) {
      if (st.lp || Math.hypot(ev.clientX - st.x0, ev.clientY - st.y0) < 9) return;
      st.moved = true; clearTimeout(st.timer);
      st.ok = beginDrag(st);
    }
    if (st.ghost) { st.ghost.style.left = ev.clientX + "px"; st.ghost.style.top = ev.clientY + "px"; hoverAt(ev.clientX, ev.clientY); }
  });
  el.addEventListener("pointerup", ev => endPointer(ev, el, false));
  el.addEventListener("pointercancel", ev => endPointer(ev, el, true));
  el.addEventListener("contextmenu", ev => ev.preventDefault());
}
function beginDrag(st){
  if (!canAct()) { if (B && B.mustDraw) msg("先にカードを1枚引け。"); return false; }
  const cid = B.hand[st.idx], c = CARDS[cid];
  if (c.cost > B.energy) { msg(`気合が足りない…(⚡${c.cost}必要)`); return false; }
  if (c.kind === "s" && c.target !== "none" && !hasTarget(c.target, c.tfilter)) { msg("対象にできるカードが場にない。"); return false; }
  B.sel = st.idx; B.itemSel = -1;
  B.pend = c.kind === "s" && c.target !== "none" ? {idx:st.idx, target:c.target, tfilter:c.tfilter} : null;
  renderSlots();
  st.el.classList.add("dragging");
  const g = document.createElement("div"); g.id = "ghost";
  const cs = getComputedStyle($("screen-battle"));
  g.style.setProperty("--cw", cs.getPropertyValue("--cw")); g.style.setProperty("--ch", cs.getPropertyValue("--ch"));
  g.appendChild(cardEl(cid));
  g.style.left = st.x0 + "px"; g.style.top = st.y0 + "px";
  document.body.appendChild(g); st.ghost = g;
  msg(c.kind === "u" ? "空いている光るマスへ放せ。" : c.target === "none" ? "机の上で放すと使用。" : "対象のカードの上で放せ。");
  return true;
}
function hoverAt(x, y){
  const hit = document.elementFromPoint(x, y);
  const slot = hit && hit.closest(".slot");
  document.querySelectorAll(".slot.hover").forEach(s => { if (s !== slot) s.classList.remove("hover"); });
  if (slot && (slot.classList.contains("droppable") || slot.classList.contains("targetable"))) slot.classList.add("hover");
}
function endPointer(ev, el, cancelled){
  const st = drag; if (!st || st.el !== el) return;
  drag = null; clearTimeout(st.timer);
  if (st.ghost) st.ghost.remove();
  document.querySelectorAll(".slot.hover").forEach(s => s.classList.remove("hover"));
  if (st.lp) { renderBattle(); return; }
  if (!st.moved) { if (!cancelled) selectHand(st.idx); return; }
  if (!st.ok || cancelled || !B) { if (B) { B.sel = -1; B.pend = null; renderBattle(); } return; }
  const hit = document.elementFromPoint(ev.clientX, ev.clientY);
  const slot = hit && hit.closest(".slot");
  const c = CARDS[B.hand[st.idx]];
  if (c.kind === "u") {
    if (slot && slot.dataset.side === "p" && !B.p[+slot.dataset.lane]) return void placeUnit(+slot.dataset.lane, st.idx);
  } else if (c.target === "none") {
    if (hit && hit.closest("#b-desk,#b-scene") && !hit.closest("#b-hand")) return void castSpell(st.idx, null, null);
  } else if (slot && validTarget(slot.dataset.side, +slot.dataset.lane, B.pend)) {
    return void castSpell(st.idx, slot.dataset.side, +slot.dataset.lane);
  }
  B.sel = -1; B.pend = null; msg("");
  renderBattle();
}

function selectHand(idx){
  if (!canAct()) { if (B && B.mustDraw) msg("先にカードを1枚引け。"); return; }
  const cid = B.hand[idx], c = CARDS[cid];
  B.itemSel = -1;
  if (B.sel === idx) { B.sel = -1; B.pend = null; msg(""); renderBattle(); return; }
  if (c.cost > B.energy) { msg(`気合が足りない…(⚡${c.cost}必要)`); return; }
  B.sel = idx; B.pend = null;
  if (c.kind === "s") {
    if (c.target === "none") { castSpell(idx, null, null); return; }
    if (!hasTarget(c.target, c.tfilter)) { msg("対象にできるカードが場にない。"); B.sel = -1; renderBattle(); return; }
    B.pend = {idx, target:c.target, tfilter:c.tfilter};
    msg(c.target === "eunit" ? "対象の敵カードを選べ。" : "対象の味方カードを選べ。");
  } else msg("置きたいマスを選べ。(もう一度タップで解除/長押しで詳細)");
  renderBattle();
}

function slotClick(side, lane){
  if (Date.now() - suppressClick < 600) return;
  if (!canAct()) return;
  if (side === "p" && B.sel >= 0 && CARDS[B.hand[B.sel]].kind === "u" && !B.p[lane]) return void placeUnit(lane);
  if (B.pend && validTarget(side, lane, B.pend)) {
    if (B.pend.item) return void useItem(B.pend.itemIdx, side, lane);
    return void castSpell(B.pend.idx, side, lane);
  }
}

async function afterAction(){
  if (!B) return;
  if (B.halt && !B.over) await phaseTwo();
  if (B && !B.over) { B.busy = false; renderBattle(); }
}

async function placeUnit(lane, idx){
  if (idx === undefined) idx = B.sel;
  if (!canAct() || idx < 0) return;
  const cid = B.hand[idx], c = CARDS[cid];
  if (c.kind !== "u" || B.p[lane] || c.cost > B.energy) return;
  B.busy = true;
  B.energy -= c.cost;
  B.hand.splice(idx, 1); B.sel = -1; B.pend = null;
  const u = newPUnit(cid);
  B.p[lane] = u;
  onPlayerCardPlayed(c);
  for (const a of B.p) if (a && a !== u && a.ab.includes("rally")) a.atk++;
  if (u.ab.includes("buddy") && B.hand.length < 8) { B.hand.push(cid); fpop($("b-hand"), "相棒を呼んだ!"); }
  msg("");
  renderBattle();
  fpop($("ps" + lane), c.n);
  await sleep(220);
  if (u.ab.includes("haste") && !stopped()) await unitAttack(u, lane, true);
  await afterAction();
}

async function castSpell(idx, side, lane){
  if (!canAct()) return;
  const cid = B.hand[idx], c = CARDS[cid];
  if (c.cost > B.energy) return;
  B.busy = true;
  B.energy -= c.cost;
  B.hand.splice(idx, 1); B.sel = -1; B.pend = null;
  B.discard.push(cid);
  onPlayerCardPlayed(c);
  msg("");
  const t = side === "e" ? B.en[lane] : side === "p" ? B.p[lane] : null;
  const tS = t ? uSlot(t) : null;
  renderBattle();
  switch (cid) {
    case "rouka": t.stun = Math.max(t.stun, 1); fpop(tS, "廊下に立ってろ!"); break;
    case "seiza": t.atk = Math.max(0, t.atk - 2); fpop(tS, "正座三時間 ⚔-2"); break;
    case "ground":
      fpop(tS, "グラウンド100周!");
      await killUnit(t);
      B.energy += 2; fpop(null, "⚡+2", "#e8c76a"); break;
    case "hansei": drawCard(); drawCard(); fpop(null, "反省文:2枚ドロー"); break;
    case "shukudai": for (const u of B.en) if (u) u.atk = Math.max(0, u.atk - 1); fpop(null, "宿題三倍:敵全体⚔-1"); break;
    case "team": for (const u of B.p) if (u) { u.hp += 2; u.mhp += 2; } fpop(null, "チームワーク指導:味方♥+2"); break;
    case "aisek": fpop(tS, "愛の説教!"); await damageUnit(t, 2); break;
    case "kiai": t.atk++; t.hp++; t.mhp++; fpop(tS, "気合注入 +1/+1"); break;
    case "album": {
      const tbs = REWARD_POOL.filter(k => CARDS[k].kind === "u" && CARDS[k].tb);
      for (let i = 0; i < 2 && B.hand.length < 8; i++) B.hand.push(rnd(tbs));
      fpop(null, "卒業アルバム:体罰カードを手に"); break; }
    case "osu": B.energy++; drawCard(); fpop(null, "押忍! ⚡+1 & 1枚ドロー"); break;
    case "chorei": for (const u of B.p) if (u) { u.atk++; u.hp++; u.mhp++; } fpop(null, "全校朝礼:味方全体+1/+1"); break;
    case "tokkun":
      fpop(null, "放課後特訓:総攻撃!");
      await sleep(300);
      for (let i = 0; i < 4; i++) { if (stopped()) break; if (B.p[i]) await unitAttack(B.p[i], i, true); }
      break;
    case "encho": fpop(tS, "延長授業!"); await unitAttack(t, lane, true); break;
    case "taigaku": fpop(tS, "退学届……"); await killUnit(t); break;
    case "honno": {
      B.instinct++;
      for (const u of B.p) if (u) u.atk++;
      for (const u of B.p) if (u && u.ab.includes("feral")) { u.atk++; fpop(uSlot(u), "血脈 ⚔+1", "#e05040"); }
      if (B.e.id === "kaicho" && B.ctRecord > 0) { B.ctRecord = 0; fpop(null, "指導記録が消し飛んだ!", "#c86a5a"); }
      if (B.e.id === "hiroshi" && HIRO.resonate) { B.enInstinct++; for (const u of B.en.concat(B.q)) if (u) u.atk++; bubble("「ほう…その本能、儂の血も騒がせよる」"); fpop($("b-scene"), "本能の共鳴:敵の本能 +1", "#ff5040"); }
      if (B.instinct === 3) {
        renderBattle();
        await banner("覚 醒", "本能の力が全身を駆け巡る──\nネクタイを額に巻いた。もう誰にも止められない。", true, 1900);
      } else fpop(null, "本能の力 +1 (計" + B.instinct + ")", "#e05040");
      break; }
    case "curse": fpop(null, "『うちの子に限って!』…何も起きなかった。"); break;
  }
  await afterAction();
}

/* 不屈: enemy disruption (stun, nullify, conversion, confiscation, sanctions) passes this card by */
const unbowed = u => !!u && (u.ab || []).includes("unbowed");
function onPlayerCardPlayed(c){
  if (B.e.id === "kaicho" && c.tb && !unbowed(c) && B.instinct < 3) { B.ctRecord++; fpop($("b-scene"), "📋 指導記録 +1", "#e07060"); }
}

/* ---------- items ---------- */
function selectItem(i){
  if (!canAct()) { if (B && B.mustDraw) msg("先にカードを1枚引け。"); return; }
  const k = run.items[i]; if (!k) return;
  const it = ITEMS[k];
  B.sel = -1; B.pend = null;
  if (B.itemSel === i) { B.itemSel = -1; msg(""); renderBattle(); return; }
  if (it.target === "none") { useItem(i, null, null); return; }
  if (!hasTarget(it.target)) { msg("対象にできるカードが場にない。"); renderBattle(); return; }
  B.itemSel = i; B.pend = {item:true, itemIdx:i, target:it.target};
  msg(`『${it.n}』:対象の敵カードを選べ。`);
  renderBattle();
}
async function useItem(i, side, lane){
  if (!canAct()) return;
  const k = run.items[i]; if (!k) return;
  B.busy = true;
  run.items.splice(i, 1); B.itemSel = -1; B.pend = null;
  saveRun();
  const t = side === "e" ? B.en[lane] : null, tS = t ? uSlot(t) : null;
  msg(""); renderBattle();
  switch (k) {
    case "akapen": fpop(tS, "赤ペン:バツ!", "#e05040"); await damageUnit(t, 2); break;
    case "hasami": fpop(tS, "没収!", "#e05040"); await killUnit(t); break;
    case "whistle": for (const u of B.en.concat(B.q)) if (u) u.stun = Math.max(u.stun, 1); fpop(null, "ピーーーッ!! 全員、気をつけ!"); break;
    case "shussekibo": drawCard(); drawCard(); fpop(null, "出席簿:2枚ドロー"); break;
    case "bento": B.energy += 3; fpop(null, "手作り弁当:⚡+3", "#e8c76a"); break;
    case "chalkbox": tiltScale(1); fpop($("b-scale"), "チョークを1本乗せた", "#e8c76a"); renderBattle(); checkEnd(); break;
  }
  await afterAction();
}

/* ---------- combat resolution ---------- */
function getTargets(u, lane, opp){
  if (u.ab.includes("sweep")) {
    const out = [];
    for (const l of [lane - 1, lane, lane + 1]) if (l >= 0 && l < 4) out.push({lane:l, unit:opp[l]});
    return out;
  }
  if (u.ab.includes("snipe")) {
    let best = null, bl = -1;
    for (let l = 0; l < 4; l++) { const t = opp[l]; if (t && (!best || t.hp < best.hp)) { best = t; bl = l; } }
    if (best) return [{lane:bl, unit:best}];
  }
  return [{lane, unit:opp[lane]}];
}

async function damageUnit(t, dmg, srcUnit){
  if (!B || !t || dmg <= 0) return;
  t.hp -= dmg;
  const el = uEl(t);
  if (el) { el.classList.remove("hitflash"); void el.offsetWidth; el.classList.add("hitflash"); fpop(el.parentElement, "-" + dmg, "#ff6040"); const st = el.querySelector(".h"); if (st) { st.textContent = Math.max(0, t.hp); st.classList.add("hurt"); } }
  await sleep(200);
  if (t.hp <= 0) await killUnit(t);
  else if (srcUnit && t.ab.includes("counter") && srcUnit.hp > 0) {
    fpop(uSlot(srcUnit), "返り討ち!", "#c8a44a");
    srcUnit.hp -= 2;
    if (srcUnit.hp <= 0) await killUnit(srcUnit);
  }
}

async function killUnit(t){
  if (!B || !t) return;
  const el = uEl(t);
  if (el) { el.classList.add("dying"); await sleep(300); }
  if (!B) return;
  const arr = t.enemy ? (B.en.includes(t) ? B.en : B.q) : B.p;
  const i = arr.indexOf(t);
  if (i >= 0) arr[i] = null;
  for (const a of (t.enemy ? B.en : B.p)) if (a && a.ab.includes("fighter")) { a.atk++; fpop(uSlot(a), "闘魂 ⚔+1", "#e0956a"); }
  if (t.ab.includes("legacy") && !t.enemy) { drawCard(); fpop($("b-hand"), "形見:1枚ドロー", "#e8c76a"); }
  if (t.cid === "kocho") { bubble("校長「ひ、ひぃぃ…! も、もう庇いきれません…!」"); fpop($("b-scene"), "忖度の壁が崩れた!", "#e8c76a"); }
  renderBattle();
}

function tiltScale(n){ B.scale = Math.max(-loseNeed(), Math.min(winNeed(), B.scale + n)); }

async function faceDamage(attacker, dmg){
  if (!B || dmg <= 0) return;
  if (!attacker.enemy) {
    const g = B.en.find(u => u && u.ab.includes("guard"));
    if (g) { fpop(uSlot(g), "忖度!肩代わり", "#e8c76a"); await damageUnit(g, dmg, attacker); return; }
    tiltScale(dmg); figHit();
    fpop($("b-scene"), "本体に " + dmg + " ダメージ!", "#f0d080");
  } else {
    tiltScale(-dmg); shake();
    fpop($("b-mid"), "こちらに " + dmg + " ダメージ…", "#ff5040");
  }
  renderBattle();
  await sleep(260);
  checkEnd();
}

function tryNullify(u){
  if (u.enemy || unbowed(u)) return false;
  if (B.e.id === "police" && Math.random() < 0.9) return "「公務執行妨害だ」…無効化された!";
  if (B.e.id === "kaicho" && u.tb && B.instinct < 3 && Math.random() < (B.phase === 2 ? 0.5 : 0.35)) return "会長「記録済みだ」…攻撃が無効化された!";
  return false;
}

async function unitAttack(u, lane, isHaste){
  if (stopped() || !u || u.hp <= 0) return;
  if (u.stun > 0) { if (!isHaste) { u.stun--; renderBattle(); } return; }
  const opp = u.enemy ? B.p : B.en;
  const times = u.ab.includes("double") ? 2 : 1;
  for (let k = 0; k < times; k++) {
    if (stopped() || u.hp <= 0) break;
    let atkVal = u.atk;
    if (u.ab.includes("pack")) {
      const side = u.enemy ? B.en : B.p, li = side.indexOf(u);
      let adj = 0;
      if (li > 0 && side[li - 1]) adj++;
      if (li >= 0 && li < 3 && side[li + 1]) adj++;
      if (adj) { atkVal += adj; fpop(uSlot(u), "組立 ⚔+" + adj, "#e0956a"); }
    }
    if (atkVal <= 0) break;
    const el = uEl(u);
    if (el) el.classList.add(u.enemy ? "atk-down" : "atk-up");
    await sleep(190);
    const nul = tryNullify(u);
    if (nul) {
      fpop(el && el.parentElement, "無効化!", "#9ab0d8"); msg(nul);
      if (el) el.classList.remove("atk-down", "atk-up");
      await sleep(250); continue;
    }
    for (const t of getTargets(u, lane, opp)) {
      if (stopped()) break;
      if (t.unit && t.unit.hp > 0) {
        const over = atkVal - t.unit.hp;
        await damageUnit(t.unit, atkVal, u);
        if (u.ab.includes("trample") && over > 0 && !stopped()) await faceDamage(u, over);
      } else await faceDamage(u, atkVal);
    }
    if (el) el.classList.remove("atk-down", "atk-up");
    await sleep(110);
  }
}

/* ---------- turn flow ---------- */
async function ringBell(){
  if (!canAct()) { if (B && B.mustDraw) msg("先にカードを1枚引け。"); return; }
  B.busy = true; B.sel = -1; B.pend = null; B.itemSel = -1;
  renderBattle();
  msg("── 攻撃 ──");
  for (let i = 0; i < 4; i++) { if (stopped()) break; if (B.p[i]) await unitAttack(B.p[i], i, false); }
  if (!B || B.over) return;
  if (B.halt) { await phaseTwo(); if (!B || B.over) return; }
  await sleep(250);
  await enemyTurn();
  if (!B || B.over) return;
  if (B.halt) { await phaseTwo(); if (!B || B.over) return; }
  B.turn++;
  startPlayerTurn();
}

async function enemyTurn(){
  const e = B.e;
  msg("── 相手のターン ──");
  if (Math.random() < 0.7) bubble(rnd(e.quotes));
  renderBattle();
  await sleep(380);

  if (e.id === "shunin" && B.turn % (B.phase === 2 ? 2 : 3) === 0 && B.hand.length > 0) {
    stealHand(B.phase === 2 ? "主任「抜き打ちだ。動くな」" : "主任「定期検査の時間だ」");
    renderBattle(); await sleep(550);
  }
  if (e.id === "counselor") {
    B.ctConvert++;
    if (B.ctConvert % (B.phase === 2 ? 2 : 3) === 0) {
      const cands = []; B.p.forEach((u, i) => { if (u && u.tb && !unbowed(u)) cands.push(i); });
      const freeE = [0,1,2,3].filter(i => !B.en[i]), freeQ = [0,1,2,3].filter(i => !B.q[i]);
      if (cands.length && (freeE.length || freeQ.length)) {
        cands.sort((a, b) => B.p[b].atk - B.p[a].atk);
        const i = Math.random() < 0.6 ? cands[0] : rnd(cands);
        const u = B.p[i]; B.p[i] = null;
        u.enemy = true; u.conv = true;
        u.n = CONVERT_NAMES[baseOf(u.cid)] || ("更生した" + u.n);
        u.icon = "🕊"; u.hp = u.mhp; u.stun = 0;
        if (freeE.length) B.en[rnd(freeE)] = u; else B.q[rnd(freeQ)] = u;
        bubble("「ほら…あなたは本当は、優しい子」");
        renderBattle();
        fpop(uSlot(u), "傾聴:寝返った!", "#b090e0");
        await sleep(750);
      }
    }
  }
  if (e.id === "nushi") {
    if (B.scale > -2) { tiltScale(-1); fpop($("b-scale"), "静養:傾きが戻された…", "#80d0a8"); }
    if (B.phase === 2) for (const u of B.en) if (u && u.hp < u.mhp) { u.hp = u.mhp; fpop(uSlot(u), "全快", "#80d0a8"); }
    renderBattle(); await sleep(450);
    if (checkEnd()) return;
  }
  if (e.id === "kaicho") {
    B.ctHide++;
    if (B.ctHide % 2 === 0 && B.en.some(u => u && u.cid === "kocho")) {
      const cands = B.p.filter(u => u && !unbowed(u));
      if (cands.length) {
        const u = rnd(cands);
        u.stun = Math.max(u.stun, 1);
        bubble("校長「な、なかったことに…しましょう…ね?」");
        renderBattle();
        fpop(uSlot(u), "隠蔽体質:行動不能!", "#b090e0");
        await sleep(600);
      }
    }
    if (B.ctRecord >= 3 && B.instinct < 3) {
      B.ctRecord = 0;
      await banner("委員会の制裁", "「指導記録3件。……処分を執行する」", true, 1300);
      let best = null;
      for (const u of B.p) if (u && !unbowed(u) && (!best || u.atk > best.atk)) best = u;
      if (best) { fpop(uSlot(best), "処分執行!", "#ff5040"); await killUnit(best); }
      await faceDamage({enemy:true}, 2);
      if (stopped()) return;
      renderBattle();
    }
  }
  if (e.id === "hiroshi" && B.turn % HIRO.every[B.phase - 1] === 0) {
    B.enInstinct++;
    for (const u of B.en.concat(B.q)) if (u) u.atk++;
    bubble("「本能が…滾るのう…!」");
    renderBattle();
    fpop($("b-scene"), "敵の本能 +1!", "#ff5040");
    await sleep(600);
  }

  /* queued cards step forward */
  let moved = false;
  for (let i = 0; i < 4; i++) if (B.q[i] && !B.en[i]) { B.en[i] = B.q[i]; B.q[i] = null; moved = true; }
  if (moved) { renderBattle(); await sleep(380); }

  for (let i = 0; i < 4; i++) { if (stopped()) return; if (B.en[i]) await unitAttack(B.en[i], i, false); }
  if (stopped()) return;

  if (e.id === "police" && B.turn >= 3) { await policeArrest(); return; }
  await spawnQueue(B.turn + 1, true);
}

async function spawnQueue(t, anim){
  const e = B.e;
  let budget = e.curve[Math.min(t - 1, e.curve.length - 1)] + (B.phase === 2 ? 1 : 0);
  let tries = 10;
  while (budget > 0 && tries-- > 0) {
    const free = [0,1,2,3].filter(i => !B.q[i]);
    if (!free.length) break;
    const aff = e.pool.filter(k => unitCost(k) <= budget);
    if (!aff.length) break;
    const pick = rnd(aff);
    budget -= unitCost(pick);
    const facingEmpty = free.filter(l => !B.p[l]);
    const lane = (facingEmpty.length && Math.random() < 0.6) ? rnd(facingEmpty) : rnd(free);
    B.q[lane] = newEUnit(pick, e.id === "hiroshi" ? B.enInstinct : 0, e.id === "hiroshi" ? Math.floor(B.enInstinct * HIRO.hpPer) : 0);
    if (anim) { renderBattle(); fpop($("qs" + lane), B.q[lane].n); await sleep(240); }
  }
  if (anim) renderBattle();
}

function stealHand(t){
  if (!B || B.hand.length === 0) return;
  const pool = B.hand.map((c, k) => k).filter(k => !unbowed(CARDS[B.hand[k]]));
  if (!pool.length) { bubble("主任「……その教鞭だけは、取り上げられん」"); renderBattle(); return; }
  const i = rnd(pool);
  const cid = B.hand.splice(i, 1)[0];
  bubble(t);
  fpop($("b-hand"), "没収! ─ " + CARDS[cid].n, "#ff5040");
  renderBattle();
}

function checkEnd(){
  if (!B) return true;
  if (B.over || B.halt) return true;
  if (B.scale >= winNeed()) {
    if (B.e.p2 && B.phase === 1) { B.halt = true; return true; }
    B.over = true; setTimeout(winBattle, 400); return true;
  }
  if (B.scale <= -loseNeed()) { B.over = true; setTimeout(loseBattle, 400); return true; }
  return false;
}

async function phaseTwo(){
  const e = B.e;
  B.busy = true;
  await banner("ろうそくが一本、消えた", e.n + "の様子が変わった……", true, 1700);
  if (!B) return;
  B.halt = false; B.phase = 2;
  B.en = [null,null,null,null]; B.q = [null,null,null,null];
  B.scale = 0;
  if (e.id === "hiroshi") B.enInstinct += HIRO.p2;
  $("b-fig").classList.add("p2");
  $("b-especial").textContent = e.p2.special;
  renderBattle();
  await cutIn(e, e.p2.line, true);
  if (!B) return;
  bubble(e.p2.line);
  msg("盤面が一掃された。天秤も元通りだ。");
}

async function policeArrest(){
  B.over = true;
  await banner("現 行 犯 逮 捕", "無数の手錠が、教壇の男に殺到した。\n\n※これはイベント戦闘です。この敗北にペナルティはありません。", true, 3000);
  B = null;
  playStory(ST_ARREST, () => { save.prologueDone = true; commitSave(); beginRun(); });
}

async function winBattle(){
  const e = B.e, opts = B.opts;
  if (run && run.fighting) { run.fighting = false; saveRun(); }
  await banner("勝 利", e.boss ? "「これが、俺の授業だ」" : "「次の授業も、覚悟しておけ」", false, 1500);
  B = null;
  const gained = addIgen(e.igen || 20);
  if (opts.onWin) { opts.onWin(gained); return; }
  if (e.id === "tutorial") { playStory(ST_POLICE, () => startBattle("police")); return; }
  if (e.id === "kaicho") {
    save.cleared = true; save.wins++; if (hardRules()) save.hardCleared = true; if (run.diff === "hardcore") save.hardcoreCleared = true; commitSave();
    /* the dojo and ひろし only open after a Hard-mode win */
    if (hardRules()) playStory(ST_ENDING, () => { run.bossDone = true; saveRun(); renderMap(); showScreen("screen-map"); });
    else playStory(ST_ENDING.slice(0, -1), () => homecoming("委員会は去り、学校は静けさを取り戻した。\n2G JONESの授業は、明日も続く。\n\n(……ハードモードで会長を倒した者だけが、\n剣道場の竹刀の音を聞くという)"));
    return;
  }
  if (e.id === "hiroshi") {
    save.trueCleared = true; save.wins++; commitSave();
    clearRun();
    playStory(ST_TRUE_ENDING, () => { run = null; toTitle(); });
    return;
  }
  let note = "威厳 +" + gained + "。";
  if (e.boss || opts.bonus) { const it = grantItem(); if (it) note += `アイテム『${ITEMS[it].n}』を入手。`; }
  if (e.boss) showReward(ELITE_POOL, "中ボス撃破!", note + "\n強力なカードを1枚選べ。", () => advanceStep());
  else showReward(REWARD_POOL, "勝利", note + "\n戦利品のカードを1枚選べ。", () => advanceStep());
}

async function loseBattle(){
  const e = B.e, opts = B.opts;
  if (e.id === "police") { await policeArrest(); return; }
  if (e.id === "tutorial") {
    await banner("居 眠 り 完 遂", "……生徒たちに敗北した。教育のやり直しだ。", true, 2000);
    startBattle("tutorial", {}); return;
  }
  B = null;
  if (opts.onLose) { opts.onLose(); return; }
  run.candles--;
  saveRun(); updateTopbar();
  if (run.candles > 0) {
    await banner("敗 北", "ろうそくが一本、消えた……\n(残り " + "🕯".repeat(run.candles) + ")\n\nだが、まだ授業は終わらない。再戦だ。", true, 2400);
    startBattle(e.id, opts);
  } else {
    await banner("敗 北", run.diff === "hardcore" ? "ハードコアに二度目はない。\nたった一本のろうそくが、消えた。" : "最後のろうそくが、消えた。", true, 2000);
    runOver();
  }
}

   RUN / MAP
   ========================================================= */
const AREAS = [
  { name:"1F ─ 昇降口と教室棟", sub:"非常灯だけが灯る、静まり返った廊下。", elite:"shunin", eliteRoom:"昇降口前",
    enemies:["fukiA","mihariA"], rooms:["1年A組","1年B組","1年C組","昇降口","購買部前","用具室"] },
  { name:"2F ─ 特別教室棟", sub:"理科室から、フラスコの音がした気がする。", elite:"counselor", eliteRoom:"相談室",
    enemies:["ptaB","yutoB"], rooms:["理科室","音楽室","図書室","美術室","家庭科室","視聴覚室"] },
  { name:"3F ─ 職員室エリア", sub:"廊下の最奥、校長室の扉から光が漏れている。", elite:"nushi", eliteRoom:"保健室",
    enemies:["shineiC","mikkokuC"], rooms:["職員室前","印刷室","放送室","会議室","資料室","更衣室"] }
];
const NODE_META = {
  battle:{icon:"⚔️", label:"戦闘"}, battleB:{icon:"🔥", label:"戦闘(報酬増)"}, card:{icon:"🃏", label:"カード獲得"},
  upgrade:{icon:"⬆️", label:"カード強化"}, shop:{icon:"🛒", label:"職員室ショップ"}, event:{icon:"❓", label:"???"},
  elite:{icon:"💀", label:"中ボス"}, boss:{icon:"", label:"ラスボス"}, dojo:{icon:"", label:"裏ボス"}, home:{icon:"🌅", label:"凱旋する"}
};

function mkNode(type, area){
  const a = AREAS[area - 1];
  const n = {type, room:rnd(a.rooms)};
  if (type === "battle" || type === "battleB") { n.enemy = rnd(a.enemies); n.bonus = (type === "battleB"); }
  if (type === "elite") { n.enemy = a.elite; n.room = a.eliteRoom; }
  if (type === "boss") n.room = "校長室";
  if (type === "dojo") n.room = "剣道場";
  if (type === "home") n.room = "校門";
  return n;
}
function genArea(area){
  const steps = [];
  const single = t => steps.push({nodes:[mkNode(t, area)], done:false});
  const pair = (a, b) => steps.push({nodes:[mkNode(a, area), mkNode(b, area)], done:false});
  single("battle");
  Math.random() < 0.5 ? pair("battleB", "card") : pair("battleB", "event");
  single(Math.random() < 0.5 ? "event" : "card");
  pair("shop", "upgrade");
  single("battle");
  Math.random() < 0.5 ? pair("event", "battleB") : pair("upgrade", "battleB");
  single("elite");
  if (area === 3) single("boss");
  return steps;
}

function grantItem(key){
  if (!run || run.items.length >= 3) return null;
  key = key || rnd(ITEM_KEYS);
  run.items.push(key);
  saveRun(); updateTopbar();
  return key;
}
function itemText(key){
  if (key) return `(『${ITEMS[key].n}』を入手)`;
  addIgen(10);
  return "(アイテム枠がいっぱいで持てなかった…代わりに威厳+10)";
}

function newRun(prologue){
  run = { deck:STARTER_DECK.concat(!prologue && save.legend ? ["legend"] : []), candles:2, area:1, step:0, map:genArea(1), usedEvents:[], diff:DIFFS[save.diff] ? save.diff : "easy",
          bossDone:false, items:prologue ? [] : [rnd(["akapen", "shussekibo"])], prologue:!!prologue };
  run.candles = maxCandles();
}
function beginRun(){
  newRun(false);
  saveRun();
  updateTopbar();
  renderMap();
  showScreen("screen-map");
}

/* ---------- mid-run save ---------- */
function saveRun(){ try { if (run && !run.prologue) localStorage.setItem(RUN_KEY, JSON.stringify(run)); } catch (e) {} }
function clearRun(){ try { localStorage.removeItem(RUN_KEY); } catch (e) {} }
function loadRun(){ try { const r = JSON.parse(localStorage.getItem(RUN_KEY)); return r && r.deck ? r : null; } catch (e) { return null; } }
function continueRun(){
  const r = loadRun(); if (!r) return;
  run = r; run.items = run.items || []; run.diff = DIFFS[run.diff] ? run.diff : "easy";
  /* older saves upgraded a whole card type: turn that into per-card copies */
  if (run.upgrades) { run.deck = run.deck.map(c => run.upgrades[c] ? c + "+" + run.upgrades[c] : c); delete run.upgrades; }
  run.deck.forEach(ensureCard);
  run.deck = run.deck.filter(c => CARDS[c]);
  if (run.fighting && run.diff === "hardcore") {
    run.fighting = false; run.candles = 0; updateTopbar();
    banner("敗 北", "ハードコアに逃げ道はない。\n授業を放り出した教師に、ろうそくは灯らない。", true, 2400).then(() => runOver());
    return;
  }
  updateTopbar(); renderMap(); showScreen("screen-map");
}

function renderMap(){
  const a = AREAS[run.area - 1];
  $("map-floor").innerHTML = ART.ui("school") + " " + esc(a.name);
  $("map-floor-sub").innerHTML = esc(a.sub) + ` <span class="diff-tag" style="color:${curDiff().c};border-color:${curDiff().c}">${curDiff().n}</span>`;
  const cor = $("map-corridor");
  cor.innerHTML = "";
  const steps = run.map.slice();
  if (run.bossDone) steps.push({nodes:hardRules() ? [mkNode("dojo", 3), mkNode("home", 3)] : [mkNode("home", 3)], done:false, dojoStep:true});
  steps.forEach((st, si) => {
    const row = document.createElement("div");
    row.className = "map-step" + (st.nodes.length > 1 ? " fork" : "");
    const isCurrent = run.bossDone ? !!st.dojoStep : (si === run.step);
    st.nodes.forEach(nd => {
      const m = NODE_META[nd.type];
      const el = document.createElement("div");
      el.className = "map-node" + (nd.type === "boss" ? " boss-node" : "") + (nd.type === "dojo" ? " dojo-node" : "");
      const lit = !st.done && (isCurrent || nd.type === "boss");
      if (st.done) el.classList.add("done");
      else if (isCurrent) { el.classList.add("avail"); el.onclick = () => enterNode(nd); }
      else el.classList.add("locked");
      el.innerHTML = `<div class="door">${ART.door(nd.type, lit)}${m.icon ? `<span class="ic">${ART.inkSVG("n_" + nd.type) || m.icon}</span>` : ""}</div>
        <span class="mn-label"><b>${nd.room}</b><br>${m.label}</span>`;
      row.appendChild(el);
    });
    if (isCurrent && !st.done) {
      const you = document.createElement("div");
      you.className = "map-you"; you.textContent = "▲ 2G JONES";
      row.appendChild(you);
    }
    cor.appendChild(row);
  });
  setTimeout(() => { const av = cor.querySelector(".map-node.avail"); if (av) av.scrollIntoView({block:"center", behavior:"smooth"}); }, 60);
  saveRun();
  updateTopbar();
}

function enterNode(nd){
  switch (nd.type) {
    case "battle": case "battleB": startBattle(nd.enemy, {bonus:nd.bonus}); break;
    case "elite": startBattle(nd.enemy, {}); break;
    case "boss": startBattle("kaicho", {}); break;
    case "dojo":
      playStory([{bg:"scene:dojo", sp:"", tx:"軋む渡り廊下を渡ると、月明かりの剣道場。\n奥の掛け軸には、力強い二文字。\n\n──『本能』", port:"boss:hiroshi"}], () => startBattle("hiroshi", {}));
      break;
    case "home": homecoming("委員会は去り、学校は静けさを取り戻した。\n2G JONESの授業は、明日も続く。\n\n(剣道場の亡霊は、まだ待っている……)"); break;
    case "card": showReward(REWARD_POOL, "🃏 落とし物のカード", "教室の机の中に、カードが挟まっていた。1枚選べ。", () => advanceStep()); break;
    case "upgrade": showUpgrade(() => advanceStep()); break;
    case "shop": openShop(); break;
    case "event": openEvent(); break;
  }
}

function homecoming(text){
  clearRun();
  showScreen("screen-over");
  $("over-main").textContent = "─ 凱 旋 ─";
  $("over-sub").textContent = text;
  run = null; updateTopbar();
}
function advanceStep(){
  if (!run) return;
  if (run.bossDone) { renderMap(); showScreen("screen-map"); return; }
  run.map[run.step].done = true;
  run.step++;
  if (run.step >= run.map.length && run.area < 3) {
    run.area++; run.step = 0; run.map = genArea(run.area);
    saveRun();
    banner("─ " + AREAS[run.area - 1].name + " ─", AREAS[run.area - 1].sub, false, 1800).then(() => { renderMap(); showScreen("screen-map"); });
    return;
  }
  renderMap();
  showScreen("screen-map");
}

const pickN = (pool, n) => shuffle([...new Set(pool)]).slice(0, n);
function choiceScreen(title, desc){
  showScreen("screen-choice");
  $("choice-title").innerHTML = ART.uiText(esc(title));
  $("choice-desc").textContent = desc;
  $("choice-cards").innerHTML = ""; $("choice-list").innerHTML = ""; $("choice-extra").innerHTML = "";
}
function choiceButton(html, fn){
  const b = document.createElement("button");
  b.className = "choice-btn"; b.innerHTML = html; b.onclick = fn;
  $("choice-list").appendChild(b);
  return b;
}
function pickableCard(cid, onPick, size){
  const el = cardEl(cid, size || "big");
  let lp = false;
  bindLongPress(el, () => { lp = true; showCardDetail(cid); });
  el.onclick = () => { if (lp || Date.now() - suppressClick < 600) { lp = false; return; } onPick(); };
  return el;
}

function showReward(pool, title, desc, cb){
  choiceScreen(title, desc + "\n(長押しでカード詳細)");
  let taken = false;
  pickN(pool, 3).forEach(cid => {
    $("choice-cards").appendChild(pickableCard(cid, () => {
      if (taken) return; taken = true;
      run.deck.push(cid); saveRun();
      fpop($("choice-title"), CARDS[cid].n + " を入手!", "#e8c76a");
      setTimeout(cb, 500);
    }));
  });
  choiceButton("受け取らない<small>デッキを薄く保つのも、また教育。</small>", cb);
}

function pickFromDeck(title, desc, filter, cb, cancelCb){
  choiceScreen(title, desc);
  run.deck.forEach((cid, idx) => {
    if (filter && !filter(cid)) return;
    $("choice-cards").appendChild(pickableCard(cid, () => cb(cid, idx), "mid"));
  });
  choiceButton("やめておく", cancelCb || (() => cb(null, -1)));
}

function showUpgrade(cb){
  pickFromDeck("⬆️ カード強化", "赤ペンで指導要録に書き込む。\n選んだカード1枚だけが、このラン中ずっと +1/+1。",
    cid => CARDS[cid].kind === "u" && cid !== "nafuda",
    (cid, idx) => { if (cid && idx >= 0) upgradeAt(idx); cb(); },
    () => cb());
}

const SHOP_QUOTES = [
  "「いらっしゃい。……ああ、JONES先生かい。老けたねぇ」",
  "「委員会には内緒だよ。あたしゃ、昔のやり方が嫌いじゃないんでね」",
  "「威厳が足りないねぇ。出直しといで」",
  "「まいど。……その竹刀、誰のかは聞かないどくれよ」"
];
let shopState = null;
const priceOf = cid => CARDS[cid].grad ? 55 : ([25, 40, 65][CARDS[cid].r] || 25);

function openShop(){
  const cards = pickN(REWARD_POOL, 2).concat(pickN(ELITE_POOL, 1));
  shopState = { items:[
    ...cards.map(cid => ({kind:"card", cid, price:priceOf(cid), sold:false})),
    {kind:"item", key:rnd(ITEM_KEYS), price:20, sold:false},
    {kind:"manual", price:45, sold:false},
    {kind:"remove", price:30, sold:false},
    {kind:"candle", price:50, sold:false}
  ].concat(save.legend ? [] : [{kind:"legend", price:LEGEND_PRICE, sold:false}]).concat(save.hardcore ? [] : [{kind:"hardcore", price:HARDCORE_PRICE, sold:false}])};
  if (!$("shop-face").innerHTML) $("shop-face").innerHTML = ART.boss.obachan();
  typeText($("shop-quote"), rnd(SHOP_QUOTES), 30);
  renderShop();
  showScreen("screen-shop");
}
function renderShop(){
  const box = $("shop-items"); box.innerHTML = "";
  shopState.items.forEach((it, i) => {
    const d = document.createElement("div");
    d.className = "shop-item" + (it.sold ? " soldout" : "");
    let icon, name, desc;
    if (it.kind === "card") { const c = CARDS[it.cid]; icon = cardArt(it.cid); name = c.n + (c.grad ? "(卒業生)" : ""); desc = (c.kind === "u" ? `⚔${c.atk}/♥${c.hp} ` : "") + (c.desc || sigText(c.ab)) + " ─ " + c.fl; }
    if (it.kind === "item") { const t = ITEMS[it.key]; icon = itemArt(it.key); name = t.n + "(アイテム)"; desc = t.desc + "。戦闘中にいつでも使える。"; }
    if (it.kind === "manual") { icon = ART.inkSVG("s_manual"); name = "絶版の生徒指導マニュアル"; desc = "デッキのカード1枚をこのラン中 +1/+1 に強化する。"; }
    if (it.kind === "remove") { icon = ART.inkSVG("s_remove"); name = "カード除去サービス"; desc = "デッキから不要なカードを1枚、シュレッダーにかける。"; }
    if (it.kind === "candle") { icon = ART.inkSVG("s_candle"); name = "赤い蝋燭"; desc = "消えたろうそくを灯し直す(残機全回復)。"; }
    if (it.kind === "hardcore") { icon = ART.ui("oni"); name = "ハードコアモードの解放(永久)"; desc = "ハードと同じ条件、ろうそく1本で一度負けたら終わり。獲得威厳 ×2。次のランから難易度選択に現れる。"; d.classList.add("legend"); }
    if (it.kind === "legend") { icon = cardArt("legend"); name = "伝説の教鞭(永久)"; desc = "気合1 ⚔4/♥4 ◆連撃 ◆貫通 ◆不屈(相手の妨害を受けない)。一度買えば、以後すべてのランの初期デッキに入る。"; d.classList.add("legend"); }
    d.innerHTML = `<div class="si-icon">${icon}</div><div class="si-body"><div class="si-name">${esc(name)}</div><div class="si-desc">${esc(desc)}</div></div>`;
    const btn = document.createElement("button");
    btn.className = "si-buy"; btn.textContent = "威厳 " + it.price;
    btn.disabled = it.sold || save.igen < it.price || (it.kind === "candle" && run.candles >= maxCandles())
      || (it.kind === "remove" && run.deck.length <= 6) || (it.kind === "item" && run.items.length >= 3);
    btn.onclick = () => buyItem(i);
    d.appendChild(btn);
    if (it.kind === "card") bindLongPress(d, () => showCardDetail(it.cid));
    if (it.kind === "legend") bindLongPress(d, () => showCardDetail("legend"));
    box.appendChild(d);
  });
}
function buyItem(i){
  const it = shopState.items[i];
  if (it.sold || save.igen < it.price) return;
  const q = t => typeText($("shop-quote"), t, 30);
  if (it.kind === "card") { addIgen(-it.price); it.sold = true; run.deck.push(it.cid); saveRun(); q("「まいどあり。大事に使いなよ」"); renderShop(); }
  else if (it.kind === "item") { if (!grantItem(it.key)) return; addIgen(-it.price); it.sold = true; q("「それ、先生が昔没収したやつだよ。……覚えてないかい?」"); renderShop(); }
  else if (it.kind === "hardcore") {
    if (!confirm("威厳 " + it.price + " を払って『ハードコアモード』を解放しますか?\n(次に始めるランから選べるようになります)")) return;
    addIgen(-it.price); it.sold = true; save.hardcore = true; commitSave();
    q("「本気かい。……一度きりの授業ってのも、悪くないねぇ」"); renderShop();
  }
  else if (it.kind === "legend") {
    if (!confirm("威厳 " + it.price + " を払って『伝説の教鞭』を手に入れますか?\n(以後すべてのランで初期デッキに入ります)")) return;
    addIgen(-it.price); it.sold = true; save.legend = true; commitSave(); run.deck.push("legend"); saveRun();
    q("「……ついに、これを渡す日が来たかい。あんたのだよ、最初から」"); renderShop();
  }
  else if (it.kind === "candle") { addIgen(-it.price); it.sold = true; run.candles = maxCandles(); saveRun(); q("「火の始末にゃ、気をつけな」"); renderShop(); updateTopbar(); }
  else if (it.kind === "manual") {
    pickFromDeck("📔 生徒指導マニュアル", "強化するカードを1枚選べ(+1/+1)。", cid => CARDS[cid].kind === "u" && cid !== "nafuda",
      (cid, idx) => { if (cid && idx >= 0) { addIgen(-it.price); it.sold = true; upgradeAt(idx); } renderShop(); showScreen("screen-shop"); });
  } else if (it.kind === "remove") {
    pickFromDeck("🗑 カード除去", "シュレッダーにかけるカードを選べ。", null,
      (cid, idx) => { if (cid !== null && idx >= 0) { addIgen(-it.price); it.sold = true; run.deck.splice(idx, 1); saveRun(); } renderShop(); showScreen("screen-shop"); });
  }
}
function leaveShop(){ advanceStep(); }

function openEvent(){
  const avail = EVENTS.filter(e => !run.usedEvents.includes(e.id));
  const ev = rnd(avail.length ? avail : EVENTS);
  run.usedEvents.push(ev.id); saveRun();
  const evArt = ART.ev[ev.id];
  $("event-icon").className = evArt ? "ev" : "";
  $("event-icon").innerHTML = evArt ? evArt() : esc(ev.icon);
  $("event-title").textContent = ev.title;
  const box = $("event-choices"); box.innerHTML = "";
  showScreen("screen-event");
  typeText($("event-text"), ev.tx, 18).then(() => {
    ev.choices.forEach(ch => {
      const b = document.createElement("button");
      b.className = "choice-btn";
      b.innerHTML = ch.label + "<small>" + igenLabel(ch.sub) + "</small>";
      b.onclick = () => resolveEventChoice(ch);
      box.appendChild(b);
    });
  });
  $("event-text").onclick = () => finishType($("event-text"));
}
function resolveEventChoice(ch){
  if (ch.fn === "remove") {
    pickFromDeck("🗑 カードを手放す", "過去をひとつ、燃やして手放す。", null, (cid, idx) => { if (cid !== null && idx >= 0) { run.deck.splice(idx, 1); saveRun(); } advanceStep(); });
    return;
  }
  if (ch.fn === "upgrade") { showUpgrade(() => advanceStep()); return; }
  if (ch.fn === "fight_colleague") { startEventFight("colleague"); return; }
  const result = ch.fn();
  saveRun();
  if (result === "fight_nushi") {
    eventResult("……目を開けると、白いカーテン越しに\n巨大な影が座っていた。\n「あらぁ。……いい寝顔だったわよ」", () => startEventFight("nushi"));
    return;
  }
  eventResult(result, () => advanceStep());
}
function eventResult(text, cb){
  const box = $("event-choices"); box.innerHTML = "";
  updateTopbar();
  typeText($("event-text"), igenLabel(text), 18).then(() => {
    const b = document.createElement("button");
    b.className = "choice-btn"; b.textContent = "先へ進む"; b.onclick = cb;
    box.appendChild(b);
  });
}
function startEventFight(eid){
  startBattle(eid, {
    onWin:gained => {
      const pool = eid === "colleague" ? ["tekken", "bassoku", "album", "honno", "ohuku"] : ELITE_POOL;
      showReward(pool, "激闘の果てに", "威厳+" + gained + "。褒美のカードを選べ。", () => advanceStep());
    },
    onLose:async () => {
      run.candles--; saveRun(); updateTopbar();
      if (run.candles <= 0) { runOver(); return; }
      await banner("敗 北", "ろうそくが一本消えた……(残り " + "🕯".repeat(run.candles) + ")\n相手は静かに去っていった。", true, 2200);
      advanceStep();
    }
  });
}

/* =========================================================
   RUN OVER → 卒業生カード (death card)
   ========================================================= */
function runOver(){
  clearRun();   /* the run is over the moment the last candle goes out — a reload must not bring it back */
  const units = [...new Set(run.deck.filter(c => CARDS[c].kind === "u" && c !== "nafuda"))];
  if (units.length < 1) { finishRunOver(null); return; }
  const g = {};
  const step = (title, desc, pool, apply, next) => {
    choiceScreen(title, desc);
    pickN(pool, 3).forEach(cid => $("choice-cards").appendChild(pickableCard(cid, () => { apply(CARDS[cid]); next(); })));
  };
  const abPool = units.filter(c => (CARDS[c].ab || []).length);
  step("🎓 卒業生カード ①", "最後のろうそくが消えた。\n教え子たちが、次の世代に想いを託す。\n\nまず「必要な気合」を受け継ぐカードを選べ。", units, c => { g.cost = c.cost; }, () =>
    step("🎓 卒業生カード ②", "次に「攻撃力と体力」を受け継ぐカードを選べ。", units, c => { g.atk = c.atk; g.hp = c.hp; g.tb = c.tb; }, () => {
      const finish = () => nameGrad(g);
      if (!abPool.length) { g.ab = []; finish(); return; }
      step("🎓 卒業生カード ③", "最後に「能力」を受け継ぐカードを選べ。", abPool, c => { g.ab = (c.ab || []).slice(0, 2); }, finish);
    }));
}
function nameGrad(g){
  const id = "grad_" + Date.now().toString(36);
  const def = "卒業生・" + rnd(GRAD_NAMES);
  choiceScreen("🎓 卒業証書", "この教え子に名前を。\n卒業生カードは、次のラン以降の報酬やショップに現れる。");
  const tmp = Object.assign({id, n:def, icon:"🎓", kind:"u", r:2, grad:1, fl:""}, g);
  CARDS[id] = tmp;
  $("choice-cards").appendChild(cardEl(id, "big"));
  $("choice-extra").innerHTML = `<input id="grad-name" maxlength="10" value="${esc(def)}">`;
  $("grad-name").oninput = () => { const nm = document.querySelector("#choice-cards .pc .nm"); if (nm) nm.textContent = $("grad-name").value || def; };
  choiceButton("卒業させない<small>このカードは名簿に残さない。</small>", () => { delete CARDS[id]; finishRunOver(null); });
  choiceButton("卒業させる<small>(名前は10文字まで)</small>", () => {
    const n = ($("grad-name").value || def).trim().slice(0, 10) || def;
    const rec = {id, n, cost:g.cost, atk:g.atk, hp:g.hp, ab:g.ab || [], tb:g.tb ? 1 : 0};
    save.grads = (save.grads || []).concat([rec]).slice(-4);
    commitSave();
    delete CARDS[id];
    registerGrads();
    finishRunOver(rec);
  });
}
/* 卒業生名簿: graduates show up in rewards and shops; the player can strike them off */
function openGrads(){
  choiceScreen("🎓 卒業生名簿", "卒業生カードは、報酬やショップに現れる。\nタップした卒業生を名簿から外す(元には戻せない)。");
  for (const g of (save.grads || [])) {
    if (!CARDS[g.id]) continue;
    const el = cardEl(g.id, "mid");
    el.onclick = () => { if (confirm("『" + g.n + "』を卒業生名簿から外しますか?")) removeGrad(g.id); };
    $("choice-cards").appendChild(el);
  }
  if (!(save.grads || []).length) $("choice-desc").textContent = "名簿は空だ。";
  choiceButton("タイトルへ戻る", () => toTitle());
}
function removeGrad(id){
  save.grads = (save.grads || []).filter(g => g.id !== id);
  commitSave();
  for (const pool of [REWARD_POOL, ELITE_POOL]) { const k = pool.indexOf(id); if (k >= 0) pool.splice(k, 1); }
  delete CARDS[id];
  const r = loadRun();
  if (r) { r.deck = r.deck.filter(c => c !== id && !c.startsWith(id + "+")); try { localStorage.setItem(RUN_KEY, JSON.stringify(r)); } catch (e) {} }
  openGrads();
}
function finishRunOver(rec){
  clearRun();
  showScreen("screen-over");
  $("over-main").textContent = "─ 停 職 処 分 ─";
  $("over-sub").innerHTML = ART.uiText(esc("2G JONESは校舎を後にした。\nだが、その背中はまだ折れていない。\n\n貯めた威厳ポイント【" + save.igen + "】は失われない。\n次のランに持ち越して、ショップで力を蓄えろ。" +
    (rec ? `\n\n🎓 卒業生カード『${rec.n}』が次の世代に託された。` : "")));
  run = null;
  updateTopbar();
}

/* =========================================================
   STORY PLAYER
   ========================================================= */
let story = null;
function playStory(lines, cb){
  story = {lines, i:0, cb};
  $("story-skip").style.display = lines.length > 2 ? "block" : "none";
  showScreen("screen-story");
  renderStoryLine();
}
function storyPortrait(p){
  if (!p) return "";
  if (p === "jones") return `<div class="full">${ART.jones("released")}</div>`;
  if (p === "jones_young") return `<div class="full">${ART.jones("young")}</div>`;
  if (p === "jones_awk") return `<div class="full">${ART.jones("awakened")}</div>`;
  if (p.startsWith("boss:") || p.startsWith("shadow:") || p.startsWith("sil:")) return `<div class="bust">${portraitSVG(p)}</div>`;
  if (p === "⛓") return `<div class="cuffs">${ART.cuffs()}</div>`;
  return `<span class="bigmoji">${p}</span>`;
}
function renderStoryLine(){
  const L = story.lines[story.i], prev = story.i > 0 ? story.lines[story.i - 1] : null;
  const bgEl = $("story-bg");
  if (!prev || prev.bg !== L.bg || prev.tint !== L.tint) {
    if (L.bg.startsWith("scene:")) bgEl.innerHTML = ART.bg[L.bg.slice(6)]() + (L.tint ? `<div style="position:absolute;inset:0;background:${L.tint}"></div>` : "");
    else { bgEl.innerHTML = ""; bgEl.style.background = `radial-gradient(ellipse at 50% 35%, ${L.bg} 0%, #020308 90%)`; }
  }
  if (!prev || prev.port !== L.port) $("story-port").innerHTML = storyPortrait(L.port);
  $("story-speaker").textContent = L.sp || "";
  typeText($("story-text"), L.tx, 24);
}
function storyNext(){
  if (!story) return;
  if (finishType($("story-text"))) return;
  story.i++;
  if (story.i >= story.lines.length) { const cb = story.cb; story = null; cb(); }
  else renderStoryLine();
}
function storySkip(){
  if (!story) return;
  const cb = story.cb; story = null;
  finishType($("story-text"));
  cb();
}

function toTitle(){

  if (saved) $("btn-continue").innerHTML = `続きから(${esc(AREAS[saved.area - 1].name.split(" ")[0])}・${ART.ui("candle")}×${saved.candles}・${(DIFFS[saved.diff] || DIFFS.easy).n})`;
  $("btn-skip").style.display = save.prologueDone ? "block" : "none";
  $("btn-grads").style.display = (save.grads || []).length ? "block" : "none";
  $("btn-start").textContent = save.prologueDone ? "はじめから(プロローグを見る)" : "はじめから";
  let sub = "所持している威厳 ─ " + save.igen;
  if ((save.grads || []).length) sub += "\n卒業生カード ─ " + save.grads.map(g => g.n).join("、");
  if (save.legend) sub += "\n【伝説の教鞭 所持】";
  if (save.hardcoreCleared) sub += "\n【ハードコア制覇】";
  else if (save.hardcore) sub += "\n【ハードコア解放済】";
  if (save.trueCleared) sub += "\n【本能の力の真の継承者】";
  else if (save.cleared) sub += "\n【委員会撃破済】" + (save.hardCleared ? "剣道場が待つ" : "\n(ハードで会長を倒すと、剣道場への道が開く)");
  $("title-igen").textContent = sub;
  if (!$("title-art").innerHTML) $("title-art").innerHTML = ART.jones(save.trueCleared ? "awakened" : "released");
  updateTopbar();
  showScreen("screen-title");
}
function titleStart(skip){
  if (loadRun() && !confirm("進行中のランを破棄して、最初から始めますか?")) return;
  pickDifficulty(() => startFresh(skip));
}
function pickDifficulty(cb){
  choiceScreen("難易度を選べ", "選んだ難易度はこのランの間ずっと続く。\n(プロローグの授業と逮捕イベントは共通)");
  for (const k of ["easy", "normal", "hard", "hardcore"]) {
    const d = DIFFS[k];
    if (k === "hardcore" && !save.hardcore) {
      const b = choiceButton(`<span style="color:#7a5a62">ハードコア(未解放)</span><small>購買部で威厳 ${HARDCORE_PRICE} を払うと挑戦できる。</small>`, () => {});
      b.disabled = true; continue;
    }
    const b = choiceButton(`<span style="color:${d.c}">${d.n}</span>${save.diff === k ? " ◂ 前回" : ""}<small>${esc(d.sub)}</small>`, () => { save.diff = k; commitSave(); cb(); });
    if (save.diff === k) b.classList.add("hl");
  }
  choiceButton("タイトルへ戻る<small>まだ校舎には入らない。</small>", () => toTitle());
}
function startFresh(skip){
  clearRun();
  if (skip) { playStory(ST_RESTART, () => beginRun()); return; }
  newRun(true);
  updateTopbar();
  playStory(ST_PROLOGUE, () => startBattle("tutorial", {}));
}
function wipeSave(){
  if (confirm("威厳ポイント・卒業生カード・進行中のランを含む全データを消去します。よろしいですか?")) {
    localStorage.removeItem(SAVE_KEY); clearRun(); location.reload();
  }
}
