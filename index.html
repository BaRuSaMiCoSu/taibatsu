/* =========================================================
   RUN OVER → 卒業生カード (death card)
   ========================================================= */
function runOver(){
  const units = [...new Set(run.deck.filter(c => CARDS[c].kind === "u" && c !== "nafuda"))];
  if (units.length < 1) { finishRunOver(null); return; }
  const g = {};
  const step = (title, desc, pool, apply, next) => {
    choiceScreen(title, desc);
    pickN(pool, 3).forEach(cid => $("choice-cards").appendChild(pickableCard(cid, () => { apply(CARDS[cid]); next(); })));
  };
  const abPool = units.filter(c => (CARDS[c].ab || []).length);
  step("🎓 卒業生カード ①", "最後のろうそくが消えた。\n教え子たちが、次の世代に想いを託す。\n\nまず「コスト」を受け継ぐカードを選べ。", units, c => { g.cost = c.cost; }, () =>
    step("🎓 卒業生カード ②", "次に「攻撃力と体力」を受け継ぐカードを選べ。", units, c => { g.atk = c.atk; g.hp = c.hp; g.tb = c.tb; }, () => {
      const finish = () => nameGrad(g);
      if (!abPool.length) { g.ab = []; finish(); return; }
      step("🎓 卒業生カード ③", "最後に「能力」を受け継ぐカードを選べ。", abPool, c => { g.ab = (c.ab || []).slice(0, 2); }, finish);
    }));
}
function nameGrad(g){
  const id = "grad_" + Date.now().toString(36);
  const def = "卒業生・" + rnd(GRAD_NAMES);
  choiceScreen("🎓 卒業証書", "この教え子に名前を。\n卒業生カードは、次のラン以降の報酬やショップに現れる。");
  const tmp = Object.assign({id, n:def, icon:"🎓", kind:"u", r:2, grad:1, fl:""}, g);
  CARDS[id] = tmp;
  $("choice-cards").appendChild(cardEl(id, "big"));
  $("choice-extra").innerHTML = `<input id="grad-name" maxlength="10" value="${esc(def)}">`;
  $("grad-name").oninput = () => { const nm = document.querySelector("#choice-cards .pc .nm"); if (nm) nm.textContent = $("grad-name").value || def; };
  choiceButton("卒業させる<small>(名前は10文字まで)</small>", () => {
    const n = ($("grad-name").value || def).trim().slice(0, 10) || def;
    const rec = {id, n, cost:g.cost, atk:g.atk, hp:g.hp, ab:g.ab || [], tb:g.tb ? 1 : 0};
    save.grads = (save.grads || []).concat([rec]).slice(-4);
    commitSave();
    delete CARDS[id];
    registerGrads();
    finishRunOver(rec);
  });
}
function finishRunOver(rec){
  clearRun();
  showScreen("screen-over");
  $("over-main").textContent = "─ 停 職 処 分 ─";
  $("over-sub").textContent = "2G JONESは校舎を後にした。\nだが、その背中はまだ折れていない。\n\n貯めた威厳ポイント【" + save.igen + "】は失われない。\n次のランに持ち越して、ショップで力を蓄えろ。" +
    (rec ? `\n\n🎓 卒業生カード『${rec.n}』が次の世代に託された。` : "");
  run = null;
  updateTopbar();
}

/* =========================================================
   STORY PLAYER
   ========================================================= */
let story = null;
function playStory(lines, cb){
  story = {lines, i:0, cb};
  $("story-skip").style.display = lines.length > 2 ? "block" : "none";
  showScreen("screen-story");
  renderStoryLine();
}
function storyPortrait(p){
  if (!p) return "";
  if (p === "jones") return `<div class="full">${ART.jones("released")}</div>`;
  if (p === "jones_young") return `<div class="full">${ART.jones("young")}</div>`;
  if (p === "jones_awk") return `<div class="full">${ART.jones("awakened")}</div>`;
  if (p.startsWith("boss:") || p.startsWith("shadow:")) return `<div class="bust">${portraitSVG(p)}</div>`;
  return `<span class="bigmoji">${p}</span>`;
}
function renderStoryLine(){
  const L = story.lines[story.i], prev = story.i > 0 ? story.lines[story.i - 1] : null;
  const bgEl = $("story-bg");
  if (!prev || prev.bg !== L.bg || prev.tint !== L.tint) {
    if (L.bg.startsWith("scene:")) bgEl.innerHTML = ART.bg[L.bg.slice(6)]() + (L.tint ? `<div style="position:absolute;inset:0;background:${L.tint}"></div>` : "");
    else { bgEl.innerHTML = ""; bgEl.style.background = `radial-gradient(ellipse at 50% 35%, ${L.bg} 0%, #020308 90%)`; }
  }
  if (!prev || prev.port !== L.port) $("story-port").innerHTML = storyPortrait(L.port);
  $("story-speaker").textContent = L.sp || "";
  typeText($("story-text"), L.tx, 24);
}
function storyNext(){
  if (!story) return;
  if (finishType($("story-text"))) return;
  story.i++;
  if (story.i >= story.lines.length) { const cb = story.cb; story = null; cb(); }
  else renderStoryLine();
}
function storySkip(){
  if (!story) return;
  const cb = story.cb; story = null;
  finishType($("story-text"));
  cb();
}

/* =========================================================
   DECK OVERLAY / TOPBAR / SCREENS
   ========================================================= */
function openDeck(){
  const box = $("od-cards"); box.innerHTML = "";
  const deck = B ? B.deck.concat(B.hand, B.discard) : (run ? run.deck : []);
  if (!deck.length) box.innerHTML = '<div style="color:#5b6684;font-size:12px;padding:30px">まだデッキがない。ランを開始しよう。</div>';
  deck.slice().sort((a, b) => CARDS[a].cost - CARDS[b].cost).forEach(cid => {
    const el = cardEl(cid, "mid");
    el.style.setProperty("--cw", "76px"); el.style.setProperty("--ch", "100px");
    el.onclick = () => showCardDetail(cid);
    box.appendChild(el);
  });
  $("overlay-deck").classList.add("show");
}
function closeDeck(){ $("overlay-deck").classList.remove("show"); }

function updateTopbar(){
  $("tb-igen").textContent = "威厳 " + save.igen;
  $("tb-candles").innerHTML = run && !run.prologue ? '<span class="candle-lit">🕯</span>'.repeat(run.candles) + '<span class="candle-out">🕯</span>'.repeat(Math.max(0, 2 - run.candles)) : "";
  $("tb-items").textContent = run && run.items ? run.items.map(k => ITEMS[k].icon).join("") : "";
  $("tb-area").textContent = run && !run.prologue ? AREAS[run.area - 1].name + (B ? " ─ 戦闘中" : "") : (B ? "プロローグ" : "");
}
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

/* =========================================================
   TITLE / INIT
   ========================================================= */
function toTitle(){
  run = null; B = null;
  const saved = loadRun();
  $("btn-continue").style.display = saved ? "block" : "none";
  if (saved) $("btn-continue").textContent = `続きから(${AREAS[saved.area - 1].name.split(" ")[0]}・🕯×${saved.candles})`;
  $("btn-skip").style.display = save.prologueDone ? "block" : "none";
  $("btn-start").textContent = save.prologueDone ? "はじめから(プロローグを見る)" : "はじめから";
  let sub = "所持している威厳 ─ " + save.igen;
  if ((save.grads || []).length) sub += "\n卒業生カード ─ " + save.grads.map(g => g.n).join("、");
  if (save.trueCleared) sub += "\n【本能の力の真の継承者】";
  else if (save.cleared) sub += "\n【委員会撃破済 ─ 剣道場が待つ】";
  $("title-igen").textContent = sub;
  if (!$("title-art").innerHTML) $("title-art").innerHTML = ART.jones(save.trueCleared ? "awakened" : "released");
  updateTopbar();
  showScreen("screen-title");
}
function titleStart(skip){
  if (loadRun() && !confirm("進行中のランを破棄して、最初から始めますか?")) return;
  clearRun();
  if (skip) { playStory(ST_RESTART, () => beginRun()); return; }
  newRun(true);
  updateTopbar();
  playStory(ST_PROLOGUE, () => startBattle("tutorial", {}));
}
function wipeSave(){
  if (confirm("威厳ポイント・卒業生カード・進行中のランを含む全データを消去します。よろしいですか?")) {
    localStorage.removeItem(SAVE_KEY); clearRun(); location.reload();
  }
}

loadSave();
save.grads = save.grads || [];
registerGrads();
toTitle();
window.addEventListener("resize", () => { if (B && !drag) renderHand(); });

</script>
